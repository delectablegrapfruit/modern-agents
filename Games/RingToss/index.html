<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hot Dog Ring Toss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Rye&display=swap">
<style>
  /* One visual world: a midway booth at night. Single dark theme on purpose. */
  :root {
    color-scheme: dark;
    --night: #161230;
    --ink: #120e28;
    --panel: rgba(18, 14, 40, 0.74);
    --cream: #f3e6c8;
    --cream-dim: #b9ad90;
    --red: #d23a2e;
    --mustard: #efb62a;
    --bulb: #ffd27a;
    --line: rgba(243, 230, 200, 0.2);
    --display: "Rye", "Georgia", "Times New Roman", serif;
    --ui: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--night); color: var(--cream);
    font-family: var(--ui); font-size: 16px; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #c.dragging { cursor: grabbing; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--mustard); outline-offset: 2px; }

  .hud {
    position: fixed; left: 0; right: 0; top: 0; z-index: 2; pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  }
  .hud button, .ticket { pointer-events: auto; }
  .brand { display: grid; gap: 8px; min-width: 0; }
  .brand h1 {
    margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(22px, 3.2vw, 30px);
    line-height: 1; letter-spacing: 0.01em; color: var(--bulb);
    text-shadow: 0 0 18px rgba(255, 190, 90, 0.45), 0 2px 0 #7a1e16;
  }
  .modes { display: flex; flex-wrap: wrap; gap: 6px; }
  .mode {
    display: grid; gap: 1px; text-align: left; cursor: pointer; padding: 6px 12px 7px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
    font-weight: 700; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.05;
  }
  .mode small { font-weight: 500; font-size: 12px; letter-spacing: 0.04em; text-transform: none; color: var(--cream-dim); }
  .mode[aria-selected="true"] { background: var(--mustard); border-color: var(--mustard); color: var(--ink); }
  .mode[aria-selected="true"] small { color: #4a3510; }

  .right { display: flex; gap: 8px; align-items: flex-start; }
  /* the score is a carnival ticket: notched corners, perforated stub */
  .ticket {
    --notch: radial-gradient(circle at 0 0, transparent 7px, #000 7.5px) top left,
             radial-gradient(circle at 100% 0, transparent 7px, #000 7.5px) top right,
             radial-gradient(circle at 0 100%, transparent 7px, #000 7.5px) bottom left,
             radial-gradient(circle at 100% 100%, transparent 7px, #000 7.5px) bottom right;
    -webkit-mask: var(--notch); -webkit-mask-size: 51% 51%; -webkit-mask-repeat: no-repeat;
    mask: var(--notch); mask-size: 51% 51%; mask-repeat: no-repeat;
    background: var(--cream); color: var(--ink); padding: 8px 14px 9px; min-width: 128px;
    display: grid; gap: 4px; justify-items: end; font-variant-numeric: tabular-nums;
    border-top: 0; position: relative;
  }
  .ticket::after {
    content: ""; position: absolute; left: 10px; right: 10px; top: 48px; border-top: 2px dashed rgba(18, 14, 40, 0.3);
  }
  .t-row { display: flex; align-items: baseline; gap: 10px; }
  .t-label { font-weight: 600; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--red); }
  .t-num { font-family: var(--display); font-size: 34px; line-height: 1; color: var(--red); min-width: 2ch; text-align: right; }
  .rings { display: flex; gap: 5px; padding-top: 6px; }
  .rings i { width: 12px; height: 12px; border-radius: 50%; border: 3.5px solid var(--c); box-sizing: border-box; transition: opacity .2s; }
  .rings i.spent { opacity: 0.22; }
  .rings i.up { box-shadow: 0 0 0 2px rgba(18, 14, 40, 0.25); }
  .t-best { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #5a4f38; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 3px; border: 1px solid var(--line); background: var(--panel);
    cursor: pointer; display: grid; place-items: center; padding: 0;
  }
  .icon-btn svg { width: 18px; height: 18px; }

  .stamp {
    position: fixed; left: 50%; top: 36%; z-index: 3; pointer-events: none; text-align: center; width: max-content; max-width: calc(100vw - 32px);
    transform: translate(-50%, -50%) rotate(-4deg);
  }
  .stamp-title {
    font-family: var(--display); font-size: clamp(40px, 9vw, 88px); line-height: 1; color: var(--cream);
    text-shadow: 0 3px 0 #7a1e16, 0 0 30px rgba(255, 190, 90, 0.35);
  }
  .stamp-pts { margin-top: 6px; font-weight: 700; font-size: clamp(18px, 3vw, 26px); letter-spacing: 0.16em; text-transform: uppercase; color: var(--bulb); }
  .stamp.big .stamp-title { color: var(--bulb); text-shadow: 0 4px 0 #8a2418, 0 0 40px rgba(255, 200, 100, 0.6); }
  .stamp.dud .stamp-title { color: var(--cream-dim); font-size: clamp(30px, 6vw, 56px); text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5); }
  .stamp.dud .stamp-pts { color: var(--cream-dim); }
  .stamp.show { animation: stamp 0.42s cubic-bezier(0.2, 1.5, 0.4, 1) both; }
  @keyframes stamp {
    from { opacity: 0; transform: translate(-50%, -50%) rotate(-4deg) scale(1.9); }
    to { opacity: 1; transform: translate(-50%, -50%) rotate(-4deg) scale(1); }
  }

  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; pointer-events: none;
    padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: grid; justify-items: center; gap: 7px; text-align: center;
  }
  .hint { font-size: 17px; font-weight: 600; letter-spacing: 0.03em; color: var(--cream); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7); max-width: 34ch; transition: opacity .3s; }
  .hint kbd { font: inherit; font-size: 13px; padding: 0 4px; border: 1px solid var(--line); border-radius: 2px; }
  .meter { position: relative; width: min(260px, 70vw); height: 10px; border-radius: 2px; background: rgba(243, 230, 200, 0.16); overflow: visible; }
  .meter-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 2px; background: linear-gradient(90deg, var(--mustard), var(--red)); }
  .meter-last { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--cream); opacity: 0; }
  .readout { display: flex; gap: 14px; font-size: 14px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cream-dim); font-variant-numeric: tabular-nums; }
  .readout b { color: var(--cream); font-weight: 700; }
  .dock.idle .meter, .dock.idle .readout { opacity: 0.45; }

  .over {
    position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; padding: 16px;
    background: rgba(12, 9, 28, 0.55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  .card {
    width: min(360px, 100%); box-sizing: border-box; background: var(--cream); color: var(--ink);
    padding: 22px 22px 20px; display: grid; gap: 14px; border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 0 0 6px var(--cream), inset 0 0 0 8px var(--red);
  }
  .card-eyebrow { font-weight: 700; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--red); }
  .card-score { font-family: var(--display); font-size: 64px; line-height: 0.9; color: var(--red); display: flex; align-items: baseline; gap: 10px; }
  .card-score small { font-family: var(--ui); font-size: 16px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #5a4f38; }
  .throws { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
  .throws li { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; padding: 3px 0; border-bottom: 1px dashed rgba(18, 14, 40, 0.18); }
  .throws li i { width: 14px; height: 14px; border-radius: 50%; border: 4px solid var(--c); box-sizing: border-box; }
  .throws li span:last-child { font-weight: 700; }
  .card-best { font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5a4f38; }
  .card-best.new { color: var(--red); }
  .btn {
    cursor: pointer; border: 0; border-radius: 3px; padding: 12px 16px; background: var(--red); color: var(--cream);
    font-weight: 700; font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .btn:hover { background: #b82f25; }

  .boot { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; font-size: 18px; letter-spacing: 0.06em; color: var(--cream-dim); z-index: 5; background: var(--night); }

  @media (max-width: 520px) {
    .mode { padding: 5px 9px 6px; font-size: 13px; }
    .mode small { font-size: 11px; }
    .ticket { min-width: 104px; padding: 7px 11px 8px; }
    .t-num { font-size: 28px; }
    .ticket::after { top: 42px; }
    .icon-btn { width: 34px; height: 34px; }
  }
  /* wide screens: the ring in hand sits bottom centre, so the controls move to the corner */
  @media (min-width: 760px) and (min-aspect-ratio: 1/1) {
    .dock { right: auto; justify-items: start; text-align: left; max-width: 360px; }
    .hint { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stamp.show { animation: none; }
  }
</style>
</head>
<body>
<canvas id="c" aria-label="Ring toss booth. Drag down and release to toss a ring; arrow keys aim and set power, Space tosses."></canvas>

<header class="hud">
  <div class="brand">
    <h1>Ring Toss</h1>
    <div class="modes" role="tablist" aria-label="Target">
      <button class="mode" id="mode-hotdog" role="tab" aria-selected="true" data-mode="hotdog">Hot Dog<small>Ringer 5 · Leaner 1</small></button>
      <button class="mode" id="mode-balloon" role="tab" aria-selected="false" data-mode="balloon">Water Balloon<small>Knot 10 · On it 3</small></button>
    </div>
  </div>
  <div class="right">
    <div class="ticket" aria-live="polite">
      <div class="t-row"><span class="t-label">Score</span><span class="t-num" id="score">0</span></div>
      <div class="rings" id="rings" aria-label="Rings left"></div>
      <div class="t-best">Best <span id="best">0</span></div>
    </div>
    <button class="icon-btn" id="mute" aria-label="Mute sound" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path id="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
  </div>
</header>

<div class="stamp" id="stamp" hidden><div class="stamp-title" id="stampTitle"></div><div class="stamp-pts" id="stampPts"></div></div>

<footer class="dock idle" id="dock">
  <div class="hint" id="hint">Drag down to wind up, sideways to aim, let go to toss.</div>
  <div class="meter" aria-hidden="true"><div class="meter-fill" id="meterFill"></div><div class="meter-last" id="meterLast"></div></div>
  <div class="readout"><span>Power <b id="powerTxt">0%</b></span><span>Aim <b id="aimTxt">straight</b></span></div>
</footer>

<div class="over" id="over" hidden>
  <div class="card" role="dialog" aria-labelledby="overEyebrow">
    <div class="card-eyebrow" id="overEyebrow">Round over</div>
    <div class="card-score"><span id="overScore">0</span><small>points</small></div>
    <ol class="throws" id="overList"></ol>
    <div class="card-best" id="overBest"></div>
    <button class="btn" id="again">Toss five more</button>
  </div>
</div>

<div class="boot" id="boot">Setting up the booth…</div>

<script id="physics">
/* Ring toss physics: rigid tori against static signed-distance colliders and each other.
   Pure JS, no DOM, so it runs in the page and under Node for tuning. */
(function (root) {
  'use strict';

  const G = 9.81;
  const RING = { R: 0.12, r: 0.016, mass: 0.06 };
  const NS = 48; // sample spheres around the tube's centre circle
  const IA = RING.mass * (RING.R * RING.R + 0.75 * RING.r * RING.r); // about the symmetry axis
  const ID = RING.mass * (0.5 * RING.R * RING.R + 0.625 * RING.r * RING.r); // about a diameter
  const INV_M = 1 / RING.mass, INV_IA = 1 / IA, INV_ID = 1 / ID;
  const COS = new Float64Array(NS), SIN = new Float64Array(NS);
  for (let i = 0; i < NS; i++) { COS[i] = Math.cos((i / NS) * Math.PI * 2); SIN[i] = Math.sin((i / NS) * Math.PI * 2); }

  const STAND = { r: 0.22, h: 0.07, round: 0.012 };
  const HOTDOG = { r: 0.034, len: 0.34 };
  const BACK_Z = -1.76;
  const POSTS = [[-1.9, -1.55], [1.9, -1.55]];
  const POST_R = 0.06;

  const MAT = {
    floor: { e: 0.22, mu: 0.5 },
    back: { e: 0.1, mu: 0.6 },
    post: { e: 0.3, mu: 0.4 },
    stand: { e: 0.28, mu: 0.45 },
    hotdog: { e: 0.12, mu: 0.4 },
    balloon: { e: 0.58, mu: 0.1 }, // taut, wet latex: springy and slick
    ring: { e: 0.25, mu: 0.3 },
  };

  // balloon springs: squash stiffness/damping, rocking stiffness/damping, how hard hits drive each
  const WOBBLE = { KS: 1000, CS: 7.5, KT: 190, CT: 4.2, AS: 1.3, AT: 9 };

  const SUBSTEPS = 4, VEL_ITERS = 5, POS_ITERS = 3;
  const BETA = 0.25, SLOP = 0.0006, MARGIN = 0.001, BOUNCE_MIN = 0.45;

  // Throw: fixed release point, 50 degree launch, power sets speed, aim sets yaw.
  const THROW = { x: 0, y: 0.85, z: 2.4, elev: 50 * Math.PI / 180, vMin: 3.1, vMax: 5.7, yawMax: 14 * Math.PI / 180, spin: 15 };

  // Upside-down water balloon: a surface of revolution, knot at the top. (s = radius, y = height above the stand)
  const BALLOON_CTRL = [
    [0, 0], [0.085, 0.004], [0.14, 0.02], [0.17, 0.055], [0.18, 0.1], [0.172, 0.145], [0.148, 0.188],
    [0.112, 0.228], [0.074, 0.263], [0.042, 0.293], [0.022, 0.318], [0.017, 0.335], [0.024, 0.348],
    [0.031, 0.362], [0.028, 0.378], [0.016, 0.39], [0, 0.395],
  ];
  function buildProfile(ctrl, per) {
    const pts = [], n = ctrl.length;
    const cr = (a, b, c, d, t) => 0.5 * (2 * b + (c - a) * t + (2 * a - 5 * b + 4 * c - d) * t * t + (3 * b - a - 3 * c + d) * t * t * t);
    for (let i = 0; i < n - 1; i++) {
      const p0 = ctrl[Math.max(i - 1, 0)], p1 = ctrl[i], p2 = ctrl[i + 1], p3 = ctrl[Math.min(i + 2, n - 1)];
      for (let k = 0; k < per; k++) {
        const t = k / per;
        pts.push([Math.max(0, cr(p0[0], p1[0], p2[0], p3[0], t)), cr(p0[1], p1[1], p2[1], p3[1], t)]);
      }
    }
    pts.push(ctrl[n - 1].slice());
    pts[0] = [0, 0];
    for (let i = 1; i < pts.length; i++) if (pts[i][1] <= pts[i - 1][1]) pts[i][1] = pts[i - 1][1] + 1e-5;
    return pts;
  }
  const PROFILE = buildProfile(BALLOON_CTRL, 5);
  const PROFILE_TOP = PROFILE[PROFILE.length - 1][1];
  const PROFILE_MAXR = PROFILE.reduce((m, p) => Math.max(m, p[0]), 0);
  const KNOT_Y = 0.335; // the neck: a ring below this and around the axis is on the knot

  function rhoAt(y) {
    let lo = 0, hi = PROFILE.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (PROFILE[mid][1] <= y) lo = mid; else hi = mid; }
    const a = PROFILE[lo], b = PROFILE[hi];
    return a[0] + (b[0] - a[0]) * ((y - a[1]) / (b[1] - a[1]));
  }
  const P2 = { ns: 0, ny: 0 };
  function profileSDF(s, y) {
    let best = 1e9, bx = 0, by = 0, bk = 0;
    for (let k = 0; k < PROFILE.length - 1; k++) {
      const a = PROFILE[k], b = PROFILE[k + 1];
      const dx = b[0] - a[0], dy = b[1] - a[1];
      let t = ((s - a[0]) * dx + (y - a[1]) * dy) / (dx * dx + dy * dy);
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const cx = a[0] + dx * t, cy = a[1] + dy * t;
      const d2 = (s - cx) * (s - cx) + (y - cy) * (y - cy);
      if (d2 < best) { best = d2; bx = cx; by = cy; bk = k; }
    }
    const dist = Math.sqrt(best);
    const inside = y > 0 && y < PROFILE_TOP && s < rhoAt(y);
    if (dist > 1e-7) {
      P2.ns = (s - bx) / dist; P2.ny = (y - by) / dist;
      if (inside) { P2.ns = -P2.ns; P2.ny = -P2.ny; }
    } else {
      const a = PROFILE[bk], b = PROFILE[bk + 1], l = Math.hypot(b[0] - a[0], b[1] - a[1]);
      P2.ns = (b[1] - a[1]) / l; P2.ny = -(b[0] - a[0]) / l;
    }
    return inside ? -dist : dist;
  }

  // ---------- colliders: sdf(x, y, z, o) -> distance, o gets the outward normal and the surface velocity ----------
  function zeroVel(o) { o.svx = 0; o.svy = 0; o.svz = 0; }
  function plane(kind, nx, ny, nz, off) {
    return {
      kind, mat: MAT[kind],
      near: (p) => nx * p.x + ny * p.y + nz * p.z - off < RING.R + RING.r + 0.02,
      sdf(x, y, z, o) { o.nx = nx; o.ny = ny; o.nz = nz; zeroVel(o); return nx * x + ny * y + nz * z - off; },
    };
  }
  function vcapsule(kind, cx, cz, y0, y1, rad) {
    return {
      kind, mat: MAT[kind],
      near: (p) => Math.hypot(p.x - cx, p.z - cz) < rad + RING.R + RING.r + 0.02 && p.y > y0 - 0.2 && p.y < y1 + rad + 0.2,
      sdf(x, y, z, o) {
        const cy = y < y0 ? y0 : y > y1 ? y1 : y;
        const dx = x - cx, dy = y - cy, dz = z - cz, l = Math.hypot(dx, dy, dz) || 1e-9;
        o.nx = dx / l; o.ny = dy / l; o.nz = dz / l; zeroVel(o);
        return l - rad;
      },
    };
  }
  function stand() {
    const { r, h, round } = STAND;
    return {
      kind: 'stand', mat: MAT.stand,
      near: (p) => Math.hypot(p.x, p.y - h / 2, p.z) < r + h + RING.R + RING.r + 0.02,
      sdf(x, y, z, o) {
        const s = Math.hypot(x, z), sy = y >= h / 2 ? 1 : -1;
        const qx = s - (r - round), qy = Math.abs(y - h / 2) - (h / 2 - round);
        const mx = Math.max(qx, 0), my = Math.max(qy, 0), outside = Math.hypot(mx, my);
        const d = Math.min(Math.max(qx, qy), 0) + outside - round;
        let ns, ny;
        if (outside > 1e-9) { ns = mx / outside; ny = (my / outside) * sy; } else if (qx > qy) { ns = 1; ny = 0; } else { ns = 0; ny = sy; }
        const hx = s > 1e-9 ? x / s : 1, hz = s > 1e-9 ? z / s : 0;
        o.nx = ns * hx; o.ny = ny; o.nz = ns * hz; zeroVel(o);
        return d;
      },
    };
  }

  // The balloon wobbles: a squash (volume kept) and a rocking tilt about its base, both damped springs driven by hits.
  class Balloon {
    constructor(baseY) {
      this.kind = 'balloon'; this.mat = MAT.balloon;
      this.px = 0; this.py = baseY; this.pz = 0;
      this.s = 0; this.sv = 0; this.tx = 0; this.tz = 0; this.tvx = 0; this.tvz = 0;
      this.m = new Float64Array(9);
      this.accTx = 0; this.accTz = 0; this.accSq = 0;
      this.update();
    }
    update() {
      const th = Math.hypot(this.tx, this.tz), m = this.m;
      if (th < 1e-9) { m.set([1, 0, 0, 0, 1, 0, 0, 0, 1]); } else {
        const kx = this.tx / th, kz = this.tz / th, c = Math.cos(th), sn = Math.sin(th), C = 1 - c;
        // Rodrigues about (kx, 0, kz)
        m[0] = c + kx * kx * C; m[1] = -kz * sn; m[2] = kx * kz * C;
        m[3] = kz * sn; m[4] = c; m[5] = -kx * sn;
        m[6] = kz * kx * C; m[7] = kx * sn; m[8] = c + kz * kz * C;
      }
      this.sy = 1 + this.s; this.sxz = 1 / Math.sqrt(this.sy);
      this.dsy = this.sv; this.dsxz = -0.5 * Math.pow(this.sy, -1.5) * this.sv;
    }
    near(p) { return Math.hypot(p.x - this.px, p.y - this.py - 0.2, p.z - this.pz) < 0.32 + RING.R + RING.r; }
    sdf(x, y, z, o) {

    const p = parts[i];
    if (p.life > 0) {
      p.life -= dt; p.v.y -= 5.5 * dt; p.v.multiplyScalar(1 - 1.6 * dt); p.p.addScaledVector(p.v, dt);
      if (p.p.y < 0.01) { p.p.y = 0.01; p.v.set(0, 0, 0); p.rv.multiplyScalar(0); }
      p.r.x += p.rv.x * dt; p.r.y += p.rv.y * dt; p.r.z += p.rv.z * dt;
      dummy.position.copy(p.p); dummy.rotation.copy(p.r); dummy.scale.setScalar(Math.min(1, p.life * 2));
    } else { dummy.position.set(0, -10, 0); dummy.scale.setScalar(0); }
    dummy.updateMatrix(); confetti.setMatrixAt(i, dummy.matrix);
  }
  confetti.instanceMatrix.needsUpdate = true;
}
confetti.instanceColor.needsUpdate = true;
scene.add(confetti);

// ---------------- sound: all synthesized ----------------
const Sound = (() => {
  let ctx = null, out = null, noise = null, muted = false;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); out = ctx.createGain(); out.gain.value = muted ? 0 : 0.55; out.connect(ctx.destination);
    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(f0, f1, dur, type, vol, delay = 0) {
    if (!ctx) return;
    const t = ctx.currentTime + delay, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.02);
  }
  function hiss(dur, vol, type, f0, f1, q = 1, delay = 0) {
    if (!ctx) return;
    const t = ctx.currentTime + delay, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(out); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  return {
    init,
    setMuted(m) { muted = m; if (out) out.gain.value = m ? 0 : 0.55; },
    whoosh() { hiss(0.32, 0.25, 'bandpass', 380, 1700, 1.4); },
    clack(v) { const k = clamp(v / 5, 0.1, 1); hiss(0.05, 0.35 * k, 'highpass', 1800, 1200); tone(540, 380, 0.07, 'triangle', 0.22 * k); },
    clink(v) { const k = clamp(v / 4, 0.1, 1); tone(2150, 2100, 0.18, 'sine', 0.12 * k); tone(3240, 3200, 0.12, 'sine', 0.07 * k); },
    thud(v) { const k = clamp(v / 5, 0.1, 1); tone(170, 80, 0.1, 'sine', 0.4 * k); hiss(0.06, 0.12 * k, 'lowpass', 900, 300); },
    boing(v) { const k = clamp(v / 5, 0.15, 1); tone(120, 260, 0.09, 'sine', 0.35 * k); tone(260, 95, 0.32, 'sine', 0.3 * k, 0.08); hiss(0.14, 0.16 * k, 'lowpass', 700, 200); },
    ding() { tone(1318.5, 1318.5, 0.9, 'sine', 0.22); tone(1975.5, 1975.5, 0.7, 'sine', 0.12, 0.01); tone(2637, 2637, 0.4, 'sine', 0.05, 0.02); },
    fanfare() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, f, i === 3 ? 0.7 : 0.18, 'triangle', 0.2, i * 0.11)); tone(1568, 1568, 0.8, 'sine', 0.08, 0.33); },
    plink() { tone(880, 880, 0.25, 'triangle', 0.14); tone(1318.5, 1318.5, 0.35, 'triangle', 0.12, 0.09); },
    womp() { tone(233, 116, 0.5, 'sawtooth', 0.06); },
  };
})();

// ---------------- game ----------------
const game = {
  mode: 'hotdog', sim: null, meshes: new Map(), colorOf: new Map(), thrown: 0, score: 0, results: [],
  state: 'aim', current: null, flyT: 0, resultT: 0,
  power: 0, aim: 0, dragging: false, sx: 0, sy: 0, lastPower: null, lastAim: null, lastSound: new Map(),
};
const store = {
  get(k) { try { return Number(localStorage.getItem(k)) || 0; } catch { return 0; } },
  set(k, v) { try { localStorage.setItem(k, String(v)); } catch { /* private window: best score just won't persist */ } },
};
const bestKey = () => `ring-toss-best-${game.mode}`;

function newRound(mode = game.mode) {
  for (const m of game.meshes.values()) scene.remove(m);
  game.meshes.clear(); game.colorOf.clear(); game.lastSound.clear();
  if (!game.sim || game.sim.mode !== mode) game.sim = new RP.Sim(mode); else game.sim.reset();
  game.mode = mode; game.thrown = 0; game.score = 0; game.results = []; game.current = null;
  game.state = 'aim'; game.power = 0; game.aim = 0;
  hotdog.visible = mode === 'hotdog'; balloonTilt.visible = mode === 'balloon';
  drawSign(mode);
  for (const b of document.querySelectorAll('.mode')) b.setAttribute('aria-selected', String(b.dataset.mode === mode));
  $('over').hidden = true;
  $('best').textContent = store.get(bestKey());
  hideStamp(); updateHud(); updateMeter(); showHand();
}

function updateHud() {
  $('score').textContent = game.score;
  const rings = $('rings'); rings.innerHTML = '';
  for (let i = 0; i < ROUND; i++) {
    const el = document.createElement('i');
    el.style.setProperty('--c', RING_COLORS[i][0]);
    if (i < game.thrown) el.className = 'spent'; else if (i === game.thrown && game.state === 'aim') el.className = 'up';
    rings.appendChild(el);
  }
  rings.setAttribute('aria-label', `${ROUND - game.thrown} rings left`);
}
function updateMeter() {
  $('meterFill').style.width = `${Math.round(game.power * 100)}%`;
  const last = $('meterLast');
  if (game.lastPower != null) { last.style.left = `${game.lastPower * 100}%`; last.style.opacity = '0.9'; } else last.style.opacity = '0';
  $('powerTxt').textContent = `${Math.round(game.power * 100)}%`;
  const deg = game.aim * RP.THROW.yawMax * 180 / Math.PI;
  $('aimTxt').textContent = Math.abs(deg) < 0.05 ? 'straight' : `${Math.abs(deg).toFixed(1)}° ${deg > 0 ? 'right' : 'left'}`;
  $('dock').classList.toggle('idle', !(game.dragging || game.power > 0));
  guide.visible = game.state === 'aim' && (game.dragging || game.power > 0);
  guide.rotation.y = -game.aim * RP.THROW.yawMax;
}
function showHand() {
  hand.material = ringMats[game.thrown % ringMats.length];
  hand.visible = game.state === 'aim' && game.thrown < ROUND;
}

function toss() {
  if (game.state !== 'aim' || game.thrown >= ROUND) return;
  const r = game.sim.throwRing(game.power, game.aim);
  const mesh = ringMesh(game.thrown);
  mesh.position.set(r.p.x, r.p.y, r.p.z);
  scene.add(mesh); game.meshes.set(r.id, mesh); game.colorOf.set(r.id, game.thrown);
  game.current = r; game.thrown++; game.state = 'flying'; game.flyT = 0;
  game.lastPower = game.power; game.lastAim = game.aim;
  hand.visible = false; guide.visible = false;
  $('hint').style.opacity = '0';
  Sound.whoosh(); updateHud(); updateMeter();
}

const STAMP_BIG = new Set(['ringer', 'bullseye']);
const STAMP_DUD = new Set(['miss', 'close', 'slid', 'out', 'rimmed', 'bounced']);
let stampTimer = 0;
function showStamp(res) {
  const el = $('stamp');
  $('stampTitle').textContent = res.label;
  $('stampPts').textContent = res.pts ? `+${res.pts} point${res.pts > 1 ? 's' : ''}` : 'no points';
  el.className = 'stamp' + (STAMP_BIG.has(res.key) ? ' big' : STAMP_DUD.has(res.key) ? ' dud' : '');
  el.hidden = false; void el.offsetWidth; el.classList.add('show');
  clearTimeout(stampTimer); stampTimer = setTimeout(hideStamp, 1250);
}
function hideStamp() { $('stamp').hidden = true; }

function scoreThrow() {
  const r = game.current, res = game.sim.classify(r);
  game.score += res.pts; game.results.push({ ...res, color: game.colorOf.get(r.id) });
  showStamp(res);
  const at = new THREE.Vector3(r.p.x, r.p.y + 0.05, r.p.z);
  if (res.key === 'bullseye') { Sound.fanfare(); burst(at, 140); }
  else if (res.key === 'ringer') { Sound.ding(); burst(at, 90); }
  else if (res.pts > 0) { Sound.plink(); burst(at, 30); }
  else Sound.womp();
  game.state = 'result'; game.resultT = 0;
  updateHud();
}

function endRound() {
  game.state = 'over';
  const best = store.get(bestKey()), isNew = game.score > best;
  if (isNew) store.set(bestKey(), game.score);
  $('best').textContent = Math.max(best, game.score);
  $('overScore').textContent = game.score;
  const list = $('overList'); list.innerHTML = '';
  for (const r of game.results) {
    const li = document.createElement('li');
    const dot = document.createElement('i'); dot.style.setProperty('--c', RING_COLORS[r.color][0]);
    const name = document.createElement('span'); name.textContent = r.label.replace(/!$/, '');
    const pts = document.createElement('span'); pts.textContent = r.pts ? `+${r.pts}` : '0';
    li.append(dot, name, pts); list.appendChild(li);
  }
  const ob = $('overBest');
  ob.textContent = isNew && game.score > 0 ? 'New best for this target' : `Best on this target: ${Math.max(best, game.score)}`;
  ob.classList.toggle('new', isNew && game.score > 0);
  $('over').hidden = false;
  $('again').focus({ preventScroll: true });
}

// impacts -> sounds, at most one per ring and surface every 70 ms
function drainEvents() {
  const ev = game.sim.events;
  for (const e of ev) {
    const k = e.ring + e.kind, t = game.sim.time;
    if ((game.lastSound.get(k) || -1) > t - 0.07) continue;
    game.lastSound.set(k, t);
    if (e.kind === 'ring') Sound.clink(e.speed);
    else if (e.kind === 'balloon') Sound.boing(e.speed);
    else if (e.kind === 'hotdog') Sound.thud(e.speed);
    else Sound.clack(e.speed);
  }
  ev.length = 0;
}

const qTmp = new THREE.Vector3();
function syncMeshes() {
  for (const r of game.sim.rings) {
    const m = game.meshes.get(r.id); if (!m) continue;
    if (r.out) { m.visible = false; continue; }
    m.position.set(r.p.x, r.p.y, r.p.z); m.quaternion.set(r.q.x, r.q.y, r.q.z, r.q.w);
  }
  const B = game.sim.balloon;
  if (B) {
    const th = Math.hypot(B.tx, B.tz);
    if (th < 1e-9) balloonTilt.quaternion.identity(); else balloonTilt.quaternion.setFromAxisAngle(qTmp.set(B.tx / th, 0, B.tz / th), th);
    balloonSquash.scale.set(B.sxz, B.sy, B.sxz);
  }
}

function updateHand(t) {
  if (!hand.visible) return;
  const T = RP.THROW, p = game.power;
  const bob = reduceMotion || game.dragging ? 0 : Math.sin(t * 0.0025) * 0.012;
  hand.position.set(T.x - game.aim * 0.06, T.y - 0.05 * p + bob, T.z + 0.1 * p);
  hand.rotation.set(-0.12 - 0.25 * p, t * 0.0006, game.aim * 0.2);
}

function updateGame(dt) {
  if (game.state === 'flying') {
    game.flyT += dt;
    if (game.sim.settled(game.current) || game.flyT > 7) scoreThrow();
  } else if (game.state === 'result') {
    game.resultT += dt;
    if (game.resultT > 1.3) {
      if (game.thrown >= ROUND) endRound();
      else { game.state = 'aim'; game.power = 0; game.aim = game.lastAim ?? 0; showHand(); updateHud(); updateMeter(); }
    }
  }
}

// ---------------- input ----------------
function dragTo(e) {
  const dx = e.clientX - game.sx, dy = e.clientY - game.sy;
  const H = window.innerHeight, W = Math.min(window.innerWidth, 800);
  game.power = clamp(dy / (0.42 * H), 0, 1);
  game.aim = clamp(-dx / (0.45 * W), -1, 1); // pull left to throw right, like a slingshot
  updateMeter();
}
canvas.addEventListener('pointerdown', (e) => {
  Sound.init();
  if (game.state !== 'aim' || e.button > 0) return;
  game.dragging = true; game.sx = e.clientX; game.sy = e.clientY;
  canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging');
  dragTo(e);
});
canvas.addEventListener('pointermove', (e) => { if (game.dragging) dragTo(e); });
function endDrag(e, cancelled) {
  if (!game.dragging) return;
  game.dragging = false; canvas.classList.remove('dragging');
  if (!cancelled && game.power > 0.04) toss(); else { game.power = 0; updateMeter(); }
}
canvas.addEventListener('pointerup', (e) => endDrag(e, false));
canvas.addEventListener('pointercancel', (e) => endDrag(e, true));
window.addEventListener('keydown', (e) => {
  const onButton = e.target instanceof HTMLButtonElement;
  if (game.state !== 'aim' || game.dragging) return;
  const fine = e.shiftKey ? 5 : 1;
  if (e.key.startsWith('Arrow') && game.power === 0 && game.lastPower != null) game.power = game.lastPower; // pick up from the last toss
  if (e.key === 'ArrowUp') game.power = clamp(game.power + 0.01 * fine, 0, 1);
  else if (e.key === 'ArrowDown') game.power = clamp(game.power - 0.01 * fine, 0, 1);
  else if (e.key === 'ArrowLeft') game.aim = clamp(game.aim - 0.02 * fine, -1, 1);
  else if (e.key === 'ArrowRight') game.aim = clamp(game.aim + 0.02 * fine, -1, 1);
  else if ((e.key === ' ' || e.key === 'Enter') && !onButton) { if (game.power > 0.04) toss(); }
  else return;
  Sound.init(); e.preventDefault(); updateMeter();
});
for (const b of document.querySelectorAll('.mode')) b.addEventListener('click', () => { Sound.init(); newRound(b.dataset.mode); });
$('again').addEventListener('click', () => newRound());
$('mute').addEventListener('click', () => {
  const m = $('mute').getAttribute('aria-pressed') !== 'true';
  $('mute').setAttribute('aria-pressed', String(m)); $('mute').setAttribute('aria-label', m ? 'Unmute sound' : 'Mute sound');
  $('wave').style.opacity = m ? '0.15' : '1';
  Sound.setMuted(m);
});
if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
  $('hint').innerHTML = 'Drag down to wind up, sideways to aim, let go to toss. Or <kbd>←</kbd><kbd>→</kbd> aim, <kbd>↑</kbd><kbd>↓</kbd> power, <kbd>Space</kbd>.';
}

// ---------------- loop ----------------
const STEP = 1 / 120;
let acc = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  acc += dt; let n = 0;
  while (acc >= STEP && n < 6) { game.sim.step(STEP); acc -= STEP; n++; }
  if (n === 6) acc = 0;
  drainEvents(); syncMeshes(); updateGame(dt); updateHand(now); updateConfetti(dt);
  if (!reduceMotion) for (const b of bulbs) b.sprite.material.opacity = 0.55 + 0.35 * (0.5 + 0.5 * Math.sin(now * 0.003 - b.i * 0.9));
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

newRound('hotdog');
if (document.fonts && document.fonts.load) document.fonts.load('92px Rye').then(() => drawSign(game.mode), () => {});
window.__ringTossStarted = true;
window.__ringToss = { game, RP }; // handy from the console
$('boot').remove();
requestAnimationFrame(frame);
</script>
</body>
</html>

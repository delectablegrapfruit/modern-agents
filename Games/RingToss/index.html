<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hot Dog Ring Toss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,600;1,9..144,800&display=swap">
<style>
  /* A studio void. The page follows the backdrop the player picks (white by default), not the OS theme. */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --ink: #151515;
    --ink-dim: #6d6d6d;
    --panel: rgba(255, 255, 255, 0.86);
    --line: rgba(21, 21, 21, 0.14);
    --accent: #d8432b;
    --display: "Fraunces", "Georgia", "Times New Roman", serif;
    --ui: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  }
  :root.dark {
    color-scheme: dark;
    --ink: #f2f1ee;
    --ink-dim: #a3a29e;
    --panel: rgba(24, 25, 28, 0.82);
    --line: rgba(242, 241, 238, 0.18);
    --accent: #ff6a4d;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: var(--ui); font-size: 16px; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #c.dragging { cursor: grabbing; }
  button { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .hud {
    position: fixed; left: 0; right: 0; top: 0; z-index: 2; pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  }
  .hud button, .panel { pointer-events: auto; }
  .brand { display: grid; gap: 10px; min-width: 0; }
  .brand h1 { margin: 0; font-family: var(--display); font-style: italic; font-weight: 800; font-size: clamp(24px, 3vw, 30px); line-height: 1; letter-spacing: -0.01em; }
  .modes { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); width: max-content; }
  .mode {
    cursor: pointer; border: 0; background: none; padding: 6px 12px 7px; text-align: left; display: grid; gap: 1px;
    font-weight: 700; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.05; color: var(--ink-dim);
  }
  .mode + .mode { border-left: 1px solid var(--line); }
  .mode small { font-weight: 500; font-size: 12px; letter-spacing: 0.03em; text-transform: none; }
  .mode[aria-selected="true"] { color: var(--bg); background: var(--ink); }

  .right { display: flex; gap: 14px; align-items: flex-start; }
  .score { display: grid; justify-items: end; gap: 5px; font-variant-numeric: tabular-nums; }
  .score-num { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 44px; line-height: 0.85; }
  .score-label { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); }
  .rings { display: flex; gap: 5px; }
  .rings i { width: 11px; height: 11px; border-radius: 50%; border: 3px solid var(--ring); box-sizing: border-box; transition: opacity .2s; }
  .rings i.spent { opacity: 0.2; }
  .tools { display: grid; gap: 6px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 3px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn[aria-expanded="true"] { background: var(--ink); color: var(--bg); }

  .panel {
    position: fixed; z-index: 5; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 60px);
    width: min(300px, calc(100vw - 32px)); box-sizing: border-box; padding: 14px 14px 16px; display: grid; gap: 14px;
    background: var(--panel); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
  }
  .panel h2 { margin: 0 0 7px; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); }
  .swatches { display: flex; flex-wrap: wrap; gap: 7px; }
  .sw {
    width: 26px; height: 26px; border-radius: 50%; padding: 0; cursor: pointer; background: var(--c);
    border: 1px solid var(--line); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
  }
  .sw.ringsw { background: none; border: 7px solid var(--c); box-shadow: 0 0 0 1px var(--line); }
  .sw[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { cursor: pointer; border: 1px solid var(--line); background: none; border-radius: 3px; padding: 4px 9px 5px; font-weight: 600; font-size: 14px; letter-spacing: 0.04em; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .toggle { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; cursor: pointer; }
  .toggle input { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; }

  .stamp {
    position: fixed; left: 50%; top: 80%; z-index: 3; pointer-events: none; text-align: center; width: max-content; max-width: calc(100vw - 32px);
    transform: translate(-50%, -50%);
  }
  .stamp-title { font-family: var(--display); font-style: italic; font-weight: 800; font-size: clamp(40px, 8vw, 84px); line-height: 1; letter-spacing: -0.02em; color: var(--ink); }
  .stamp-pts { margin-top: 4px; font-weight: 700; font-size: clamp(16px, 2.4vw, 22px); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-dim); }
  .stamp.big .stamp-title, .stamp.big .stamp-pts { color: var(--accent); }
  .stamp.dud .stamp-title { color: var(--ink-dim); font-size: clamp(30px, 5.5vw, 54px); }
  .stamp.show { animation: stamp 0.4s cubic-bezier(0.2, 1.5, 0.4, 1) both; }
  @keyframes stamp { from { opacity: 0; transform: translate(-50%, -50%) scale(1.7); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }

  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; pointer-events: none;
    padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: grid; justify-items: center; gap: 7px; text-align: center;
  }
  .hint { font-size: 16px; font-weight: 600; letter-spacing: 0.02em; max-width: 36ch; transition: opacity .3s; }
  .hint kbd { font: inherit; font-size: 13px; padding: 0 4px; border: 1px solid var(--line); border-radius: 2px; }
  .meter { position: relative; width: min(240px, 66vw); height: 6px; border-radius: 3px; background: var(--line); }
  .meter-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 3px; background: var(--ink); }
  .meter-last { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--accent); opacity: 0; }
  .readout { display: flex; gap: 14px; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .readout b { color: var(--ink); font-weight: 700; }
  .dock.idle .meter, .dock.idle .readout { opacity: 0.45; }
  @media (min-width: 760px) and (min-aspect-ratio: 1/1) {
    .dock { right: auto; justify-items: start; text-align: left; max-width: 360px; }
  }

  .over { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; padding: 16px; background: rgba(128, 128, 128, 0.14); }
  .card {
    width: min(340px, 100%); box-sizing: border-box; background: var(--panel); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 4px; padding: 22px; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.14);
  }
  .card-eyebrow { font-weight: 700; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-dim); }
  .card-score { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 64px; line-height: 0.9; display: flex; align-items: baseline; gap: 10px; }
  .card-score small { font-family: var(--ui); font-style: normal; font-size: 15px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); }
  .throws { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
  .throws li { display: grid; grid-template-columns: 1fr auto; gap: 10px; font-size: 17px; font-weight: 600; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .throws li span:last-child { font-weight: 700; }
  .card-best { font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); }
  .card-best.new { color: var(--accent); }
  .btn { cursor: pointer; border: 0; border-radius: 3px; padding: 12px 16px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase; }

  .boot { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; font-size: 18px; letter-spacing: 0.06em; color: var(--ink-dim); z-index: 6; background: var(--bg); }

  @media (max-width: 520px) {
    .mode { padding: 5px 9px 6px; font-size: 13px; }
    .mode small { font-size: 11px; }
    .score-num { font-size: 36px; }
    .icon-btn { width: 34px; height: 34px; }
  }
  @media (prefers-reduced-motion: reduce) { .stamp.show { animation: none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Ring toss. Drag down and release to toss a ring; arrow keys aim and set power, Space tosses."></canvas>

<header class="hud">
  <div class="brand">
    <h1>Ring Toss</h1>
    <div class="modes" role="tablist" aria-label="Target">
      <button class="mode" id="mode-hotdog" role="tab" aria-selected="true" data-mode="hotdog">Hot dog<small>Ringer 5</small></button>
      <button class="mode" id="mode-balloon" role="tab" aria-selected="false" data-mode="balloon">Water balloon<small>Knot 10 · On it 3</small></button>
    </div>
  </div>
  <div class="right">
    <div class="score" aria-live="polite">
      <span class="score-label">Score</span>
      <span class="score-num" id="score">0</span>
      <div class="rings" id="rings"></div>
      <span class="score-label">Best <span id="best">0</span></span>
    </div>
    <div class="tools">
      <button class="icon-btn" id="settingsBtn" aria-label="Look" aria-expanded="false" aria-controls="panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
      <button class="icon-btn" id="mute" aria-label="Mute sound" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path id="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="panel" id="panel" hidden role="dialog" aria-label="Look">
  <section><h2>Ring</h2><div class="swatches" id="ringSw"></div></section>
  <section><h2>Background</h2><div class="swatches" id="bgSw"></div></section>
  <section><h2>Pattern</h2><div class="chips" id="patChips"></div></section>
  <label class="toggle"><input type="checkbox" id="anchorToggle" checked> Show anchor point</label>
</div>

<div class="stamp" id="stamp" hidden><div class="stamp-title" id="stampTitle"></div><div class="stamp-pts" id="stampPts"></div></div>

<footer class="dock idle" id="dock">
  <div class="hint" id="hint">Drag down to wind up, sideways to aim, let go to toss.</div>
  <div class="meter" aria-hidden="true"><div class="meter-fill" id="meterFill"></div><div class="meter-last" id="meterLast"></div></div>
  <div class="readout"><span>Power <b id="powerTxt">0%</b></span><span>Aim <b id="aimTxt">straight</b></span></div>
</footer>

<div class="over" id="over" hidden>
  <div class="card" role="dialog" aria-labelledby="overEyebrow">
    <div class="card-eyebrow" id="overEyebrow">Round over</div>
    <div class="card-score"><span id="overScore">0</span><small>points</small></div>
    <ol class="throws" id="overList"></ol>
    <div class="card-best" id="overBest"></div>
    <button class="btn" id="again">Toss five more</button>
  </div>
</div>

<div class="boot" id="boot">Loading…</div>

<script id="physics">
/* Ring toss physics, floating edition. Rigid tori thrown under gravity at a target pinned by its centre: the target
   swings and spins on that pivot, a torsion spring stands it back up. No floor: misses fall away.
   Hot dog: the ring is tighter than the dog, so a ring that threads the tip grips on, squeezes the dog, slides a little,
   holds, and later snaps. Balloon: slick and springy, its knot is the bullseye.
   Pure JS, no DOM, so it runs in the page and under Node for tuning. */
(function (root) {
  'use strict';

  const G = 9.81;
  const RING = { R: 0.052, r: 0.009, mass: 0.015 }; // inner radius 43 mm: smaller than the hot dog
  const NS = 32; // sample spheres around the tube's centre circle
  const IA = RING.mass * (RING.R * RING.R + 0.75 * RING.r * RING.r);
  const ID = RING.mass * (0.5 * RING.R * RING.R + 0.625 * RING.r * RING.r);
  const INV_M = 1 / RING.mass, INV_IA = 1 / IA, INV_ID = 1 / ID;
  const COS = new Float64Array(NS), SIN = new Float64Array(NS);
  for (let i = 0; i < NS; i++) { COS[i] = Math.cos((i / NS) * Math.PI * 2); SIN[i] = Math.sin((i / NS) * Math.PI * 2); }

  const CENTER_Y = 0.22; // both targets hang with their pivot here
  const KILL_Y = -1.4; // a ring this far down has fallen out of the game

  const MAT = {
    hotdog: { e: 0.2, mu: 0.45, slop: 0.0012 },
    balloon: { e: 0.55, mu: 0.1, slop: 0.003 }, // taut, wet latex: springy and slick
    ring: { e: 0.3, mu: 0.3, slop: 0.0005 },
  };

  const SUBSTEPS = 4, VEL_ITERS = 6, POS_ITERS = 3;
  const BETA = 0.25, MARGIN = 0.001, BOUNCE_MIN = 0.4;

  // Throw: fixed release point, 50 degree launch, power sets speed, aim sets yaw.
  const THROW = { x: 0, y: 0.85, z: 2.4, elev: 50 * Math.PI / 180, vMin: 3.1, vMax: 5.7, yawMax: 14 * Math.PI / 180, spin: 22 };

  // ---------- surfaces of revolution: (s = radius, y = height from the item's bottom) ----------
  const HOTDOG_CTRL = [
    [0, 0], [0.006, 0.0015], [0.009, 0.005], [0.016, 0.008], [0.028, 0.013], [0.038, 0.021], [0.045, 0.032], [0.048, 0.047],
    [0.0485, 0.12], [0.049, 0.22], [0.0485, 0.32], [0.048, 0.393], [0.045, 0.408], [0.038, 0.419], [0.028, 0.427],
    [0.016, 0.432], [0.009, 0.435], [0.006, 0.4385], [0, 0.44],
  ];
  const BALLOON_CTRL = [
    [0, 0], [0.06, 0.003], [0.11, 0.014], [0.148, 0.034], [0.172, 0.062], [0.184, 0.098], [0.184, 0.138], [0.172, 0.176],
    [0.15, 0.211], [0.12, 0.243], [0.087, 0.272], [0.057, 0.298], [0.036, 0.316], [0.024, 0.329], [0.019, 0.337],
    [0.025, 0.344], [0.03, 0.352], [0.028, 0.36], [0.021, 0.365], [0.017, 0.368], [0.018, 0.372], [0.012, 0.375], [0, 0.376],
  ];
  function buildProfile(ctrl, per) {
    const pts = [], n = ctrl.length;
    const cr = (a, b, c, d, t) => 0.5 * (2 * b + (c - a) * t + (2 * a - 5 * b + 4 * c - d) * t * t + (3 * b - a - 3 * c + d) * t * t * t);
    for (let i = 0; i < n - 1; i++) {
      const p0 = ctrl[Math.max(i - 1, 0)], p1 = ctrl[i], p2 = ctrl[i + 1], p3 = ctrl[Math.min(i + 2, n - 1)];
      for (let k = 0; k < per; k++) {
        const t = k / per;
        pts.push([Math.max(0, cr(p0[0], p1[0], p2[0], p3[0], t)), cr(p0[1], p1[1], p2[1], p3[1], t)]);
      }
    }
    pts.push(ctrl[n - 1].slice());
    pts[0] = [0, 0];
    for (let i = 1; i < pts.length; i++) if (pts[i][1] <= pts[i - 1][1]) pts[i][1] = pts[i - 1][1] + 1e-5;
    const flat = new Float64Array(pts.length * 2);
    pts.forEach((p, i) => { flat[2 * i] = p[0]; flat[2 * i + 1] = p[1]; });
    return { points: pts, pts: flat, n: pts.length, top: pts[pts.length - 1][1], maxR: pts.reduce((m, p) => Math.max(m, p[0]), 0) };
  }
  function segAt(P, y) { // index k with pts[k].y <= y < pts[k+1].y (y is monotonic along the profile)
    const a = P.pts;
    let lo = 0, hi = P.n - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (a[2 * mid + 1] <= y) lo = mid; else hi = mid; }
    return lo;
  }
  function rhoAt(P, y) {
    if (y <= 0 || y >= P.top) return 0;
    const a = P.pts, k = segAt(P, y);
    return a[2 * k] + (a[2 * k + 2] - a[2 * k]) * ((y - a[2 * k + 1]) / (a[2 * k + 3] - a[2 * k + 1]));
  }
  const P2 = { ns: 0, ny: 0 };
  function profileSDF(P, s, y) {
    const a = P.pts, n = P.n;
    const k0 = segAt(P, y < 0 ? 0 : y > P.top ? P.top : y);
    let best = Infinity, bx = 0, by = 0, bk = k0;
    const seg = (k) => {
      const ax = a[2 * k], ay = a[2 * k + 1], dx = a[2 * k + 2] - ax, dy = a[2 * k + 3] - ay;
      let t = ((s - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy);
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const cx = ax + dx * t, cy = ay + dy * t, d2 = (s - cx) * (s - cx) + (y - cy) * (y - cy);
      if (d2 < best) { best = d2; bx = cx; by = cy; bk = k; }
    };
    seg(k0);
    for (let k = k0 - 1; k >= 0; k--) { const gap = y - a[2 * k + 3]; if (gap > 0 && gap * gap > best) break; seg(k); }
    for (let k = k0 + 1; k < n - 1; k++) { const gap = a[2 * k + 1] - y; if (gap > 0 && gap * gap > best) break; seg(k); }
    const dist = Math.sqrt(best), inside = s < rhoAt(P, y);
    if (dist > 1e-7) {
      P2.ns = (s - bx) / dist; P2.ny = (y - by) / dist;
      if (inside) { P2.ns = -P2.ns; P2.ny = -P2.ny; }
    } else {
      const dx = a[2 * bk + 2] - a[2 * bk], dy = a[2 * bk + 3] - a[2 * bk + 1], l = Math.hypot(dx, dy);
      P2.ns = dy / l; P2.ny = -dx / l;
    }
    return inside ? -dist : dist;
  }

  const HOTDOG_P = buildProfile(HOTDOG_CTRL, 4);
  const BALLOON_P = buildProfile(BALLOON_CTRL, 4);
  // where the tip is exactly as wide as the ring's hole: past this the ring has to squeeze on
  const HOTDOG_CATCH = (() => { for (let y = HOTDOG_P.top; y > 0; y -= 0.0005) if (rhoAt(HOTDOG_P, y) >= RING.R - RING.r) return y; return 0; })();

  const SPECS = {
    hotdog: {
      profile: HOTDOG_P, pivot: HOTDOG_P.top / 2, mass: 0.25,
      freq: 2.4, zeta: 0.14, yawDamp: 0.6, squash: null,
      assist: { radius: 0.1, above: 0.4, kp: 1600, kd: 80, ko: 40 },
      grip: { f0: 30, f1: 25, breakMin: 2.2, breakMax: 3.2 },
    },
    balloon: {
      profile: BALLOON_P, pivot: 0.19, mass: 0.6,
      freq: 1.5, zeta: 0.1, yawDamp: 0.4, squash: { K: 800, C: 5.6, A: 3.5, max: 0.18 },
      assist: { radius: 0.08, above: 0.3, kp: 1100, kd: 66, ko: 25 },
      knotY: 0.337, // the neck: a ring below this and around the axis is on the knot
    },
  };
  for (const s of Object.values(SPECS)) { // a solid of revolution's inertia, near enough: cylinder of the same size
    const P = s.profile, r = P.maxR, h = P.top;
    s.Ia = 0.5 * s.mass * r * r; s.Id = s.mass * (3 * r * r + h * h) / 12;
    s.K = s.Id * (2 * Math.PI * s.freq) ** 2; s.C = 2 * s.zeta * Math.sqrt(s.K * s.Id);
  }

  function quatToMat(q, m) {
    const { w, x, y, z } = q;
    m[0] = 1 - 2 * (y * y + z * z); m[1] = 2 * (x * y - w * z); m[2] = 2 * (x * z + w * y);
    m[3] = 2 * (x * y + w * z); m[4] = 1 - 2 * (x * x + z * z); m[5] = 2 * (y * z - w * x);
    m[6] = 2 * (x * z - w * y); m[7] = 2 * (y * z + w * x); m[8] = 1 - 2 * (x * x + y * y);
  }
  function integrateQuat(q, wx, wy, wz, h) {
    const qw = q.w, qx = q.x, qy = q.y, qz = q.z, hh = 0.5 * h;
    q.w += hh * (-wx * qx - wy * qy - wz * qz);

    m.position.set(r.p.x, r.p.y, r.p.z); m.quaternion.set(r.q.x, r.q.y, r.q.z, r.q.w);
    const st = strain(r);
    m.scale.set(1 + 0.05 * st, 1, 1 + 0.05 * st);
    if (st > 0) {
      if (!game.straining.has(r.id)) { game.straining.add(r.id); Sound.strain(); }
      const a = 0.0016 * st; m.position.x += (Math.random() - 0.5) * a; m.position.y += (Math.random() - 0.5) * a; m.position.z += (Math.random() - 0.5) * a;
      m.rotateX((Math.random() - 0.5) * 0.05 * st); m.rotateZ((Math.random() - 0.5) * 0.05 * st);
    }
  }
  if (game.mode === 'hotdog') {
    const grooves = [];
    for (const r of sim.rings) if (r.grip) grooves.push({ s: r.grip.s, d: r.grip.squeeze * (1 + 0.6 * strain(r)) });
    for (let i = relax.length - 1; i >= 0; i--) { // the dog springs back, wobbling
      const g = relax[i]; g.t += dt;
      const d = g.d0 * Math.exp(-g.t / 0.22) * Math.cos(g.t * Math.PI * 2 * 7);
      if (g.t > 1.2) relax.splice(i, 1); else grooves.push({ s: g.s, d });
    }
    deformDog(grooves);
  } else {
    // dents follow each ring pressing on the latex, eased so they swell and fade
    invQ.set(tg.q.x, tg.q.y, tg.q.z, tg.q.w).invert();
    const dents = [];
    for (const r of sim.rings) {
      const want = !r.out && r.contact && (r.touched & 2) ? Math.min(0.012, r.pen * 1.6 + 0.002) : 0;
      const cur = game.dents.get(r.id) || 0, d = cur + (want - cur) * (1 - Math.exp(-(want > cur ? 30 : 6) * dt));
      game.dents.set(r.id, d);
      if (d < 0.0003 || r.out) continue;
      const c = tmpV.set(r.p.x - tg.p.x, r.p.y - tg.p.y, r.p.z - tg.p.z).applyQuaternion(invQ);
      const a = tmpA.set(r.ax, r.ay, r.az).applyQuaternion(invQ);
      dents.push({ c: { x: c.x / tg.sxz, y: c.y / tg.sy + BAL_PIVOT, z: c.z / tg.sxz }, a: { x: a.x, y: a.y, z: a.z }, d });
    }
    deformBalloon(dents);
  }
}

// camera: tight on the target while aiming, pulling out to keep a ring in the air in frame
const camTmp = { f: new THREE.Vector3(), r: new THREE.Vector3(), u: new THREE.Vector3(), d: new THREE.Vector3() };
function frameFor(points, look) {
  const { f, r, u, d } = camTmp;
  f.copy(look).sub(CAM).normalize(); r.crossVectors(f, camera.up).normalize(); u.crossVectors(r, f);
  let tv = 0, th = 0;
  for (const [p, pv, ph] of points) {
    d.copy(p).sub(CAM); const z = d.dot(f); if (z < 0.2) continue;
    tv = Math.max(tv, (Math.abs(d.dot(u)) + pv) / z); th = Math.max(th, (Math.abs(d.dot(r)) + ph) / z);
  }
  return THREE.MathUtils.radToDeg(2 * Math.atan(Math.max(tv, th / camera.aspect) * 1.08));
}
const centre = new THREE.Vector3(0, RP.CENTER_Y - 0.03, 0), ringPos = new THREE.Vector3(), lookWant = new THREE.Vector3();
const winding = () => game.state === 'aim' && game.thrown < ROUND && (game.dragging || game.kbWind);
function updateCamera(dt) {
  const r = game.current;
  let pts = [[centre, 0.3, 0.21]];
  lookWant.copy(centre);
  if (winding()) { // pull back while winding up, more the harder you pull
    const z = 0.35 + 0.65 * game.power;
    pts = [[centre, 0.3 + 0.5 * z, 0.21 + 0.42 * z]];
    lookWant.y += 0.1 * z;
  }
  if (r && game.state !== 'aim' && r.free && r.p.y > RP.CENTER_Y - 0.45) {
    ringPos.set(r.p.x, r.p.y, r.p.z);
    lookWant.lerp(ringPos, 0.5);
    pts = [[centre, 0.3, 0.21], [ringPos, 0.09, 0.09]];
  }
  const fovWant = Math.min(70, frameFor(pts, lookWant));
  const k = view.ready ? 1 - Math.exp(-7 * dt) : 1;
  view.look.lerp(lookWant, k); view.fov += (fovWant - view.fov) * k; view.ready = true;
  camera.position.copy(CAM); camera.lookAt(view.look);
  if (Math.abs(camera.fov - view.fov) > 1e-4) { camera.fov = view.fov; camera.updateProjectionMatrix(); }
  anchor.quaternion.copy(camera.quaternion);
  anchor.visible = prefs.anchor;
}

function updateGame(dt, simDt) {
  if (game.state === 'flying') {
    game.flyT += simDt;
    const res = game.sim.result(game.current, game.flyT);
    if (res) scoreThrow(res);
  } else if (game.state === 'result') {
    game.resultT += dt;
    if (game.resultT > 1.3) {
      if (game.thrown >= ROUND) endRound();
      else { game.state = 'aim'; game.power = 0; game.aim = game.lastAim ?? 0; updateHud(); updateMeter(); }
    }
  }
}

// ---------------- input ----------------
function dragTo(e) {
  const dx = e.clientX - game.sx, dy = e.clientY - game.sy, H = window.innerHeight, W = Math.min(window.innerWidth, 800);
  game.power = clamp(dy / (0.42 * H), 0, 1);
  game.aim = clamp(-dx / (0.45 * W), -1, 1); // pull left to throw right, like a slingshot
  updateMeter();
}
canvas.addEventListener('pointerdown', (e) => {
  Sound.init(); closePanel();
  if (game.state !== 'aim' || e.button > 0) return;
  game.dragging = true; game.sx = e.clientX; game.sy = e.clientY;
  canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging');
  dragTo(e);
});
canvas.addEventListener('pointermove', (e) => { if (game.dragging) dragTo(e); });
function endDrag(cancelled) {
  if (!game.dragging) return;
  game.dragging = false; canvas.classList.remove('dragging');
  if (!cancelled && game.power > 0.04) toss(); else { game.power = 0; game.kbWind = false; updateMeter(); }
}
canvas.addEventListener('pointerup', () => endDrag(false));
canvas.addEventListener('pointercancel', () => endDrag(true));
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closePanel(); return; }
  const onControl = e.target instanceof HTMLButtonElement || e.target instanceof HTMLInputElement;
  if (game.state !== 'aim' || game.dragging || onControl) return;
  const fine = e.shiftKey ? 5 : 1;
  if (e.key.startsWith('Arrow') && game.power === 0 && game.lastPower != null) game.power = game.lastPower; // pick up from the last toss
  if (e.key.startsWith('Arrow')) game.kbWind = true; // keyboard wind-up counts as dragging
  if (e.key === 'ArrowUp') game.power = clamp(game.power + 0.01 * fine, 0, 1);
  else if (e.key === 'ArrowDown') game.power = clamp(game.power - 0.01 * fine, 0, 1);
  else if (e.key === 'ArrowLeft') game.aim = clamp(game.aim - 0.02 * fine, -1, 1);
  else if (e.key === 'ArrowRight') game.aim = clamp(game.aim + 0.02 * fine, -1, 1);
  else if (e.key === ' ' || e.key === 'Enter') { if (game.power > 0.04) toss(); }
  else return;
  if (game.power <= 0) game.kbWind = false;
  Sound.init(); e.preventDefault(); updateMeter();
});
for (const b of document.querySelectorAll('.mode')) b.addEventListener('click', () => { Sound.init(); newRound(b.dataset.mode); });
$('again').addEventListener('click', () => newRound());
$('mute').addEventListener('click', () => {
  const m = $('mute').getAttribute('aria-pressed') !== 'true';
  $('mute').setAttribute('aria-pressed', String(m)); $('mute').setAttribute('aria-label', m ? 'Unmute sound' : 'Mute sound');
  $('wave').style.opacity = m ? '0.15' : '1';
  Sound.setMuted(m);
});
if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
  $('hint').innerHTML = 'Drag down to wind up, sideways to aim, let go to toss. Or <kbd>←</kbd><kbd>→</kbd> aim, <kbd>↑</kbd><kbd>↓</kbd> power, <kbd>Space</kbd>.';
}

// look panel
function closePanel() { $('panel').hidden = true; $('settingsBtn').setAttribute('aria-expanded', 'false'); }
$('settingsBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const open = $('panel').hidden; $('panel').hidden = !open; $('settingsBtn').setAttribute('aria-expanded', String(open));
});
document.addEventListener('pointerdown', (e) => { if (!$('panel').hidden && !$('panel').contains(e.target) && e.target !== $('settingsBtn') && !$('settingsBtn').contains(e.target)) closePanel(); });
function buildOptions() {
  const mk = (box, list, key, cls, onPick) => {
    box.innerHTML = '';
    for (const [name, hex] of list) {
      const b = document.createElement('button');
      b.className = cls; b.style.setProperty('--c', hex); b.setAttribute('aria-label', name); b.title = name; b.id = `${key}-${name}`;
      b.setAttribute('aria-pressed', String(prefs[key] === name));
      b.addEventListener('click', () => { prefs[key] = name; savePrefs(); for (const o of box.children) o.setAttribute('aria-pressed', String(o === b)); onPick(); });
      box.appendChild(b);
    }
  };
  mk($('ringSw'), RING_COLORS, 'ring', 'sw ringsw', applyRingColor);
  mk($('bgSw'), BG_COLORS, 'bg', 'sw', drawBackdrop);
  const chips = $('patChips'); chips.innerHTML = '';
  for (const name of PATTERNS) {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = name; b.id = `pattern-${name}`;
    b.setAttribute('aria-pressed', String(prefs.pattern === name));
    b.addEventListener('click', () => { prefs.pattern = name; savePrefs(); for (const o of chips.children) o.setAttribute('aria-pressed', String(o === b)); drawBackdrop(); });
    chips.appendChild(b);
  }
  $('anchorToggle').checked = prefs.anchor;
  $('anchorToggle').addEventListener('change', (e) => { prefs.anchor = e.target.checked; savePrefs(); });
}

// ---------------- loop ----------------
const STEP = 1 / 120;
let acc = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const sdt = dt * timeScale(dt);
  acc += sdt; let n = 0;
  while (acc >= STEP && n < 6) { game.sim.step(STEP); acc -= STEP; n++; }
  if (n === 6) acc = 0;
  drainEvents(); syncScene(sdt); updateGame(dt, sdt); updateShards(sdt); updateCamera(dt);
  hand.visible = winding(); // the ring in hand only shows while winding up
  if (hand.visible) layoutHand(now);
  renderer.clear();
  renderer.render(scene, camera);
  if (hand.visible) { renderer.clearDepth(); renderer.render(hudScene, hudCam); }
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
buildOptions();
resize();
applyRingColor();
newRound('hotdog');
window.__ringTossStarted = true;
window.__ringToss = { game, RP, prefs }; // handy from the console
$('boot').remove();
requestAnimationFrame(frame);
</script>
</body>

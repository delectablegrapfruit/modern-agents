<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vouch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Mrs+Saint+Delafield&display=swap">
<style>
/* Layout: one column of hairline-separated posts inside a phone frame; on wide screens a screen index sits beside it */
:root{
  --bg:#ffffff;
  --bg-2:#f4f4f6;
  --ink:#111113;
  --ink-2:#4a4b52;
  --muted:#84858c;
  --line:#e9e9ec;
  --accent:#2340c8;       /* signature ink: verified people, reputation, "Open in" */
  --accent-2:#e9edfb;
  --on-accent:#ffffff;
  --desk:#e8e8eb;
  --scrim:rgba(17,17,19,.42);
  --outside:#18181b;
  --on-outside:#f1f1f3;
  --av-s:30%;--av-l:88%;--av-s2:38%;--av-l2:28%;
  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sign:'Mrs Saint Delafield','Snell Roundhand','Brush Script MT',cursive;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0c0e;--bg-2:#17171a;--ink:#ededef;--ink-2:#b3b4bb;--muted:#7e7f87;--line:#242428;
    --accent:#8a9dff;--accent-2:#1a2040;--on-accent:#0c0c0e;--desk:#050506;--scrim:rgba(0,0,0,.62);--outside:#1c1c20;
    --av-s:22%;--av-l:22%;--av-s2:40%;--av-l2:80%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0c0e;--bg-2:#17171a;--ink:#ededef;--ink-2:#b3b4bb;--muted:#7e7f87;--line:#242428;
  --accent:#8a9dff;--accent-2:#1a2040;--on-accent:#0c0c0e;--desk:#050506;--scrim:rgba(0,0,0,.62);--outside:#1c1c20;
  --av-s:22%;--av-l:22%;--av-s2:40%;--av-l2:80%;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- desk, rail, phone ---------- */
.desk{height:100%;display:flex;align-items:center;justify-content:center;gap:56px}
.rail{display:none}
#phone{position:relative;width:100%;height:100%}
#app{position:relative;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.status{display:none}
@media (min-width:560px){
  .desk{padding-block:24px;padding-inline:16px}
  #phone{width:398px;flex:none;height:min(860px,100%);border-radius:58px;padding:11px;background:#0d0d0f;box-shadow:inset 0 0 0 1.5px #313136,0 50px 100px -30px rgba(0,0,0,.45)}
  #app{border-radius:47px}
  .status{display:flex;align-items:center;justify-content:space-between;flex:none;height:48px;padding:6px 30px 0 34px;font:600 15px var(--sans);background:var(--bg);position:relative;z-index:45;transition:background .3s,color .3s}
  .status .island{position:absolute;left:50%;top:10px;width:110px;height:32px;border-radius:20px;background:#0d0d0f;transform:translateX(-50%)}
  .status .sys{display:flex;gap:6px;align-items:center}
  .status svg{height:12px;width:auto;fill:currentColor}
  .status .b2a{position:absolute;left:26px;top:17px;display:inline-flex;align-items:center;gap:2px;font:600 14px var(--sans);color:var(--accent)}
  #app.outside .status .clock{visibility:hidden}
  #app.outside .status{background:var(--outside);color:var(--on-outside)}
  #app.outside .status .b2a{color:#9fb0ff}
  .ho-b2a{display:none!important}
}
@media (min-width:1000px){
  .rail{display:flex;flex-direction:column;gap:20px;width:292px;flex:none;max-height:100%;overflow:auto;padding-block:8px}
}
.rail .thesis{font:600 18px/1.3 var(--sans);letter-spacing:-.015em;text-wrap:balance}
.rail h2{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.jumps{display:flex;flex-direction:column}
.jump{display:grid;grid-template-columns:24px 1fr;column-gap:8px;border-radius:10px;padding:6px 10px}
.jump .n{grid-row:span 2;font:500 11px/19px var(--mono);color:var(--muted)}
.jump b{font:600 13.5px/19px var(--sans)}
.jump span{font-size:12px;line-height:1.35;color:var(--muted)}
.jump:hover{background:color-mix(in srgb,var(--bg) 55%,transparent)}
.jump.on{background:var(--bg)}
.jump.on .n{color:var(--accent)}
.rail .fine{font-size:12px;color:var(--muted);line-height:1.5}
.rail .ev{margin:0;padding:0 0 0 16px;font-size:12.5px;line-height:1.45;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.sjumps{display:flex;flex-wrap:wrap;gap:6px}
.sjumps button{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font:500 12.5px var(--sans);color:var(--ink-2)}
.sjumps button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tseg{display:flex;padding:3px;border-radius:999px;background:var(--line)}
.tseg button{flex:1;padding:6px;border-radius:999px;font:600 12.5px var(--sans);color:var(--muted);text-align:center}
.tseg button.on{background:var(--bg);color:var(--ink)}

/* ---------- app frame ---------- */
#screen{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .45s}
#screen.away{transform:translateX(-26%) scale(.94);opacity:0}
#view{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--bg)}
#tabs{display:flex;flex:none;border-top:1px solid var(--line);background:var(--bg);padding-bottom:4px}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 5px;font:500 10.5px var(--sans);color:var(--muted);position:relative}
#tabs button.on{color:var(--ink)}
#tabs button.on .i{stroke-width:2.2}
#tabs .dot{position:absolute;top:7px;left:calc(50% + 7px);width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
#tabs .av{--sz:24px}
#tabs button.on .av{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
#fab{position:absolute;right:16px;bottom:72px;z-index:6;width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.45)}
#fab .i{width:24px;height:24px}

/* ---------- primitives ---------- */
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:16px;height:16px}
.i.xs{width:14px;height:14px}
.chk{width:15px;height:15px;flex:none}
.chk circle{fill:var(--accent)}
.chk path{fill:none;stroke:var(--on-accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.av{--sz:44px;width:var(--sz);height:var(--sz);border-radius:50%;flex:none;display:grid;place-items:center;font:600 calc(var(--sz)*.34)/1 var(--sans);background:hsl(var(--h) var(--av-s) var(--av-l));color:hsl(var(--h) var(--av-s2) var(--av-l2))}
.av.xs{--sz:20px}.av.sm{--sz:28px}.av.md{--sz:36px}.av.lg{--sz:60px}.av.xl{--sz:76px}
.stack{display:inline-flex}
.stack .av{box-shadow:0 0 0 2px var(--bg)}
.stack .av+.av{margin-left:-7px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 14px/1.2 var(--sans);border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 16px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.wide{width:100%;padding:12px}
.lk{color:var(--accent);font:inherit;display:inline}
.kick{font:500 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sp{flex:1}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink)}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;min-height:52px;padding:4px 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar h1{flex:1;min-width:0;margin:0;font:700 17px/1.2 var(--sans);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 small{display:block;font:500 12px var(--sans);color:var(--muted);letter-spacing:0}
.mark{display:inline-flex;align-items:center;gap:5px;font:800 21px/1 var(--sans);letter-spacing:-.045em}
.mark .chk{width:13px;height:13px;transform:translateY(-5px)}
.ttabs{display:flex}
.ttabs button{flex:1;padding:12px 0 11px;font:600 14.5px var(--sans);color:var(--muted);text-align:center;position:relative}
.ttabs button.on{color:var(--ink)}
.ttabs button.on::after{content:"";position:absolute;left:50%;bottom:0;width:44px;height:3px;border-radius:2px;background:var(--accent);transform:translateX(-50%)}
.home-top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.home-top .row1{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:6px 12px 0}
.home-top .row1 .mark{justify-self:center}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:18px 16px 8px;font:700 17px/1.2 var(--sans);letter-spacing:-.015em}
.sec small{font:500 12.5px var(--sans);color:var(--muted);letter-spacing:0}
.hint{font-size:13px;color:var(--muted);line-height:1.45}
.empty{padding:36px 24px;text-align:center;color:var(--muted);font-size:14px}

/* ---------- posts ---------- */
.post{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:12px;padding:12px 16px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.post:hover{background:color-mix(in srgb,var(--bg-2) 45%,var(--bg))}
.ctx{grid-column:1/-1;display:grid;grid-template-columns:44px 1fr;column-gap:12px;font:500 13px/1.2 var(--sans);color:var(--muted);margin:-2px 0 6px}
.ctx .i{justify-self:end;width:15px;height:15px}
.pav{align-self:start}
.pc{min-width:0}
.ph{display:flex;align-items:center;gap:4px;min-width:0;font-size:15px;line-height:1.3}
.ph .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ph .hn,.ph .tm{color:var(--muted);white-space:nowrap}
.ph .hn{overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:2}
.ph .more{margin-left:auto;color:var(--muted);padding:0 2px}
.rep{display:flex;flex-wrap:wrap;align-items:center;gap:0 5px;font-size:12.5px;line-height:1.5;color:var(--muted)}
.rep b{color:var(--accent);font-weight:600}
.txt{font-size:15px;line-height:1.45;margin-top:2px;overflow-wrap:anywhere}
.txt+.att{margin-top:10px}
.txt.lg{font-size:17px;line-height:1.45;margin-top:10px}
.vd{display:inline-flex;align-items:center;gap:5px;font:600 12.5px var(--sans);padding:2px 9px;border-radius:999px;background:var(--bg-2);color:var(--ink-2)}
.vd.loved{background:var(--accent-2);color:var(--accent)}
.triedl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:3px 0 2px;font-size:13px;color:var(--muted)}
.askk{display:inline-flex;align-items:center;gap:5px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-top:2px}
.txt.ask{font-size:16.5px;line-height:1.4}
.ansrow{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;font-size:13px;color:var(--ink-2)}
.ansrow b{color:var(--ink);font-weight:600}
.thread{display:block;margin-top:6px;font-size:14px;color:var(--accent)}
.quote{margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px}
.quote .ph{font-size:14px}
.quote .txt{font-size:14px}
.quote .att{margin-top:8px}
.acts{display:flex;justify-content:space-between;max-width:320px;margin:4px 0 0 -8px}
.acts .a{display:inline-flex;align-items:center;gap:5px;padding:7px 8px;border-radius:999px;font:500 13px var(--sans);color:var(--muted);min-width:44px}
.acts .a .i{width:18px;height:18px}
.acts .a.on{color:var(--accent)}
.acts .a:hover{color:var(--accent);background:var(--accent-2)}

/* ---------- feed post: person first, then the embed ---------- */
.fp{padding:14px 16px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.fctx{display:flex;align-items:center;gap:6px;margin:0 0 8px 50px;font:500 12.5px var(--sans);color:var(--muted)}
.phd{display:flex;align-items:center;gap:10px}
.phd .pav{flex:none}
.pid{flex:1;min-width:0}
.nmrow{display:flex;align-items:center;gap:4px;min-width:0;font-size:15px;line-height:1.3}
.nmrow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nmrow .hn{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:2}
.phd .tm{align-self:flex-start;font-size:13px;color:var(--muted);padding-top:2px}
.tok{display:flex;align-items:center;gap:5px;margin-top:2px;font-size:12.5px;line-height:1.4;color:var(--muted);white-space:nowrap}
.tok b{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.tok .sep{width:3px;height:3px;border-radius:50%;background:var(--muted);opacity:.6;margin:0 2px}
.tok .stack .av{--sz:16px;font-size:0}
.tok .i{color:var(--muted)}
.gauge{flex:none;transform:rotate(-90deg)}
.gauge circle{fill:none;stroke-width:2.6}
.gauge .gb{stroke:var(--line)}
.gauge .gf{stroke:var(--accent);stroke-linecap:round}
.fp .txt{margin-top:10px;font-size:15.5px}
.fp .acts{max-width:none;margin:4px -8px 0}
.fp .triedl{margin-top:10px}
.fp .askk{margin-top:10px}
.card{position:relative;margin-top:10px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--bg)}
.hero{position:relative;display:grid;place-items:center;padding:22px 16px;background:color-mix(in srgb,var(--tint) 16%,var(--bg))}
.hero .cv{height:196px;border-radius:3px;box-shadow:0 16px 30px -14px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.1)}
.hero .cv.music,.hero .cv.podcast,.hero .cv.article{height:178px}
.hero .new{position:absolute;left:12px;top:12px;margin:0;background:var(--bg)}
.cmeta{display:flex;flex-direction:column;gap:2px;padding:12px 14px 10px}
.cmeta .att-t{font-size:22px}
.card.big{margin-top:12px}
.card.big .hero{padding:28px 16px}
.card.big .hero .cv{height:250px}
.card.big .hero .cv.music,.card.big .hero .cv.podcast,.card.big .hero .cv.article{height:220px}
.day{display:flex;justify-content:space-between;padding:8px 16px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--bg-2);border-bottom:1px solid var(--line)}
.focus .tok{margin-top:8px}

/* ---------- the pick attachment and "Open in" ---------- */
.att{margin-top:6px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg)}
.att-m{display:flex;gap:14px;align-items:center;padding:12px;background:color-mix(in srgb,var(--tint) 9%,var(--bg))}
.att-m .cv{height:108px;flex:none;border-radius:3px;box-shadow:0 6px 14px -8px rgba(0,0,0,.5)}
.att-m .cv.music,.att-m .cv.podcast,.att-m .cv.article{height:96px}
.att-i{min-width:0;display:flex;flex-direction:column;gap:2px}
.att-t{font:500 20px/1.18 var(--serif);letter-spacing:-.005em;text-wrap:balance}
.att-b{font-size:13px;color:var(--muted);line-height:1.35}
.att-o{display:flex;align-items:center;gap:2px;border-top:1px solid var(--line);padding:2px 6px 2px 4px}
.open{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;padding:9px 8px;font:600 14px var(--sans);color:var(--accent);border-radius:10px}
.open .i{width:17px;height:17px;stroke-width:2}
.alt{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.alt:hover,.open:hover{background:var(--accent-2)}
.miss{font-size:12px;color:var(--muted);white-space:nowrap}
.aff{font:500 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap;padding-right:6px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.aff.earn{color:var(--ink-2)}
.att.sm .att-m .cv{height:64px}
.new{align-self:flex-start;margin:1px 0 2px;padding:1px 8px;border-radius:999px;background:var(--accent-2);color:var(--accent);font:600 11.5px/1.5 var(--sans)}
.hm{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:12px;color:var(--ink-2)}
.hm .i{color:var(--accent)}
.known{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.att.sm .att-t{font-size:16.5px}

/* ---------- live banner, end ---------- */
.live{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer}
.live .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.live b{color:var(--ink);font-weight:600}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.wel{padding:22px 20px 28px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.wel h1{margin:10px 0 0;font:800 31px/1.06 var(--sans);letter-spacing:-.04em;text-wrap:balance}
.wel .lede{font-size:15.5px;line-height:1.5;color:var(--ink-2)}
.wcard{border:1px solid var(--line);border-radius:18px;padding:12px 12px 4px}
.wcard .ph{font-size:14px}
.wcard .att{margin-bottom:8px}
.wpts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.wpts li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14px;line-height:1.45;color:var(--ink-2)}
.wpts li .i{color:var(--accent)}
.wpts b{color:var(--ink)}
.invite{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--bg-2);font-size:13.5px;color:var(--ink-2)}
.invite b{color:var(--ink)}
.end{padding:28px 24px 96px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.end .chk{width:28px;height:28px}
.end b{font:700 18px var(--sans);letter-spacing:-.015em}
.end p{font-size:13.5px;color:var(--muted);max-width:30ch}

/* ---------- thread (post detail) ---------- */
.focus{padding:14px 16px 0;border-bottom:1px solid var(--line)}
.fhead{display:flex;align-items:center;gap:10px}
.fhead .who{flex:1;min-width:0}
.fhead .nm{display:flex;align-items:center;gap:4px;font-weight:600;font-size:15.5px}
.fhead .hn{font-size:14px;color:var(--muted)}
.focus .rep{margin-top:8px}
.big-att{margin-top:12px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.big-att .top{display:flex;gap:14px;padding:14px}

/* ---------- reputation ---------- */

.bar3{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin:6px 0 6px}

/* ---------- profile ---------- */
.prof{padding:16px 16px 12px}
.prof .top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}

.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta b{color:var(--ink);font-weight:600}
.followedby{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--muted)}

.ptabs{position:sticky;top:52px;z-index:4;background:var(--bg);border-bottom:1px solid var(--line)}

.lrow .n{font:500 13px var(--mono);color:var(--muted);text-align:right}

/* ---------- discover, club, live, activity ---------- */
.search{position:relative;padding:8px 16px 10px}

/* ---------- compose, settings ---------- */
.ctypes{display:flex;gap:6px;padding:10px 16px}

.cbody{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:6px 16px 14px}
.cbody textarea{width:100%;min-height:120px;border:0;resize:none;background:transparent;font:17px/1.45 var(--sans);color:var(--ink);padding:10px 0}

.verdicts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.verdicts button{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:600 13px var(--sans);color:var(--ink-2)}
.verdicts button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ctools{display:flex;align-items:center;gap:6px;padding:8px 12px 8px 16px;border-top:1px solid var(--line);color:var(--accent)}
.ring{width:26px;height:26px}
.ring circle{fill:none;stroke-width:2.5}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent);transform:rotate(-90deg);transform-box:fill-box;transform-origin:center}
.srow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.srow .grow{flex:1;min-width:0}

.tog.on{background:var(--accent)}
.tog.on::after{transform:translateX(18px)}

/* ---------- sheets ---------- */
#sheet-root{position:absolute;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px 22px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.shd{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.shd .who{flex:1;min-width:0}
.shd h2{display:flex;align-items:center;gap:6px;margin:0;font:700 19px/1.2 var(--sans);letter-spacing:-.015em}

.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);font-size:15px}
.opt .grow{flex:1}
.opt small{font-size:12.5px;color:var(--muted)}
.opt[disabled]{color:var(--muted);cursor:default}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;flex:none}
.opt.on .radio{border-color:var(--accent)}

.land{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}

.land button small{display:block;font:400 12.5px var(--sans);color:var(--muted);margin-top:2px}
.land button:hover{border-color:var(--accent)}

/* ---------- handoff ---------- */
#handoff{position:absolute;inset:0;z-index:40;pointer-events:none}
#handoff.show{pointer-events:auto}
.ho-open{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:color-mix(in srgb,var(--bg) 94%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fade .2s ease-out;text-align:center}
@keyframes fade{from{opacity:0}}
.ho-open .cv{height:150px;border-radius:4px;box-shadow:0 18px 40px -16px rgba(0,0,0,.5)}
.ho-open .att-t{font-size:21px}
.track{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;width:100%;max-width:280px;font:600 13px var(--sans)}
.track .ln{position:relative;height:2px;background:var(--line);border-radius:1px}
.track .ln i{position:absolute;top:-4px;left:0;width:10px;height:10px;border-radius:50%;background:var(--accent);animation:travel 1.25s cubic-bezier(.5,0,.3,1) forwards}
@keyframes travel{to{left:calc(100% - 10px)}}
.track .to{color:var(--accent)}
.ho-open .note{font-size:13px;color:var(--muted);max-width:30ch;line-height:1.45}
.ho-out{position:absolute;inset:0;background:var(--outside);color:var(--on-outside);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;transform:translateX(100%);transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.ho-out.in{transform:none}
.ho-out .glyph{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;border:1px dashed rgba(255,255,255,.35);margin-bottom:6px}
.ho-out .glyph .i{width:30px;height:30px}
.ho-out h2{margin:0;font:600 26px/1.1 var(--sans);letter-spacing:-.02em}
.ho-out p{font-size:13.5px;line-height:1.5;color:rgba(241,241,243,.62);max-width:28ch}
.ho-out .btn{margin-top:16px;background:var(--on-outside);color:var(--outside);border-color:var(--on-outside)}
.ho-b2a{position:absolute;left:14px;top:12px;display:inline-flex;align-items:center;gap:2px;font:600 13px var(--sans);color:#9fb0ff}

#toast{position:absolute;left:16px;right:16px;bottom:78px;z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font:500 13.5px var(--sans);text-align:center;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .sheet,.ho-open{animation:none}
  .track .ln i{animation:none;left:calc(100% - 10px)}
  #screen,.ho-out,#toast,.tog::after{transition:none}
  .pulse{animation:none}
}

/* ---------- cover art text ---------- */
.cv{display:block}
.cv.film,.cv.book{aspect-ratio:2/3}
.cv.music,.cv.podcast,.cv.article{aspect-ratio:1}
.cv.art{aspect-ratio:4/5}

.sv-d{font-family:var(--sans);font-weight:800;letter-spacing:-.03em}
.sv-s{font-family:var(--serif);font-weight:600}
.sv-m{font-family:var(--mono);font-weight:500}
</style>

/* ---------- navigation ---------- */
const cur=()=>S.stack[S.stack.length-1];

let lastKey="";
function render(){
  const v=$("#view"),t=cur();
  const key=S.welcome?"welcome":S.stack.length?S.stack.map(s=>s.n+(s.id||"")).join("/"):S.tab+S.feed;
  const st=v.scrollTop;
  v.innerHTML=t?SCREENS[t.n](t.id):SCREENS[S.tab]();
  v.scrollTop=key===lastKey?st:0;lastKey=key;
  const showFab=!t&&S.tab!=="me"&&!S.welcome;
  $("#tabs").hidden=S.welcome;
  $("#fab").hidden=!showFab;$("#fab").innerHTML=icon("pen");
  $("#tabs").innerHTML=[["home","Home","home"],["discover","Discover","hash"],["activity","Activity","bell"],["me","Me",null]]
   .map(([k,l,ic])=>`<button class="${S.tab===k?"on":""}" data-tab="${k}" aria-current="${S.tab===k?"page":"false"}">${ic?icon(ic):av(U.me)}${k==="activity"&&S.unseen?`<span class="dot" aria-label="New activity"></span>`:""}${l}</button>`).join("");
  renderRail();

function ring(pct,sz=16){

}

  if(!u.cur)return `<div class="tok">Member · ${u.tried} tried</div>`;
  const fv=followedVouchers(u.id);
  return `<button class="tok" data-act="rep" data-id="${u.id}" aria-label="${u.landed}% landed, vouched for by ${u.vouchedBy}">${ring(u.landed)}<b>${u.landed}%</b><span class="sep"></span>${fv.length?`<span class="stack">${fv.slice(0,3).map(v=>av(U[v.from],"xs")).join("")}</span>`:icon("shield","xs")}<span>${u.vouchedBy}</span><span class="sep"></span><span>${CURL[u.cur]}</span></button>`;
}
const repLine=u=>u.cur?tok(u):"";

  return `<div class="att ${sm?"sm":""}" style="--tint:${w.art.c[0]}"><div class="att-m" ${pid?`data-go="thread" data-id="${pid}"`:""}>${cover(w)}<div class="att-i"><span class="kick">${ONE[w.m]} · ${w.year}</span>${st&&!sm?`<span class="new">${esc(st)}</span>`:""}<span class="att-t">${esc(w.title)}</span><span class="att-b">${esc(w.by)}</span><span class="att-b">${esc(w.spec)}</span>${checker&&!sm?`<span class="hm">${icon("shield","xs")}Human-made · checked by ${esc(first(checker.name))}</span>`:""}</div></div>${openRow(w,cur)}</div>`;
}
function hero(w,cur,pid){
  const st=stretch(w),ck=U[cur]&&U[cur].cur?U[cur]:U[w.c]&&U[w.c].cur?U[w.c]:null,go=pid?`data-go="thread" data-id="${pid}"`:"";
  return `<div class="card" style="--tint:${w.art.c[0]}"><div class="hero" ${go}>${cover(w)}${st?`<span class="new">${esc(st)}</span>`:""}</div><div class="cmeta" ${go}><span class="kick">${ONE[w.m]} · ${w.year} · ${esc(w.spec)}</span><span class="att-t">${esc(w.title)}</span><span class="att-b">${esc(w.by)}</span>${ck?`<span class="hm">${icon("shield","xs")}Human-made · checked by ${esc(first(ck.name))}</span>`:""}</div>${openRow(w,cur)}</div>`;
}
function known(w){
  const ids=(w.known||[]).filter(k=>S.follows.has(k));
  if(!ids.length)return "";
  const names=ids.map(k=>esc(first(U[k].name))),n=w.knownN||0;
  const list=n?names.join(", ")+` and ${n} others you follow`:names.length>1?names.slice(0,-1).join(", ")+" and "+names[names.length-1]:names[0];
  return `<div class="known"><span class="stack">${ids.slice(0,3).map(k=>av(U[k],"xs")).join("")}</span><span>Tried by ${list}</span></div>`;
}
function acts(p){
  const s=S.star.has(p.id),rv=S.rv.has(p.id),b=S.save.has(p.id),nr=(REPLIES[p.id]||[]).length+(ANSWERS[p.id]||[]).length||p.r||0;
  return `<div class="acts"><button class="a" data-act="reply" data-id="${p.id}" aria-label="Reply">${icon("reply")}<span>${nr||""}</span></button><button class="a ${rv?"on":""}" data-act="revouch" data-id="${p.id}" aria-label="Re-vouch" aria-pressed="${rv}">${icon("rv")}<span>${(p.rv||0)+(rv?1:0)||""}</span></button><button class="a ${s?"on":""}" data-act="star" data-id="${p.id}" aria-label="Star" aria-pressed="${s}">${icon(s?"starF":"star")}<span>${(p.st||0)+(s?1:0)||""}</span></button><button class="a ${b?"on":""}" data-act="save" data-id="${p.id}" aria-label="Save" aria-pressed="${b}">${icon(b?"bmF":"bm")}</button><button class="a" data-act="share" aria-label="Share">${icon("share")}</button></div>`;
}
const VERD={loved:"Loved it",good:"Good",meh:"Not for me"};
const note=(t,cls="")=>t?`<p class="txt ${cls}">${rich(t)}</p>`:"";
function body(p){
  const u=U[p.by];
  switch(p.t){
    case "pick":return `${note(p.text)}${hero(W[p.w],p.by,p.id)}${known(W[p.w])}`;
    case "tried":{const w=W[p.w],c=U[w.c];return `<div class="triedl"><span>Tried ${c.id==="me"?"a pick":`<button class="lk" data-act="rep" data-id="${c.id}">@${c.h}</button>’s pick`}</span><span class="vd ${p.verdict}">${p.verdict==="loved"?icon("starF","xs"):""}${VERD[p.verdict]}</span></div>${note(p.text)}${attach(w,w.c,p.of&&POSTS[p.of]&&POSTS[p.of].t==="pick"?p.of:"",true)}`;}
    case "ask":{const a=ANSWERS[p.id]||[],cu=a.filter(x=>U[x.by].cur).length;return `<span class="askk">${icon("hash","xs")}Ask</span><p class="txt ask">${rich(p.text)}</p>${a.length?`<div class="ansrow"><span class="stack">${a.slice(0,3).map(x=>av(U[x.by],"xs")).join("")}</span><span><b>${a.length} answers</b> · ${cu} from curators</span><span class="sp"></span>${icon("chevR","sm")}</div>`:`<div class="ansrow">No answers yet. Be the first.</div>`}`;}
    case "quote":{const q=POSTS[p.of],qu=U[q.by];return `${note(p.text)}<div class="quote" data-go="thread" data-id="${q.id}"><div class="ph">${av(qu,"xs")}<span class="nm">${esc(qu.name)}</span>${qu.cur?chk():""}<span class="hn">@${qu.h}</span></div>${note(q.text)}${attach(W[q.w],q.by,q.id,true)}</div>`;}
    default:return `<p class="txt">${rich(p.text)}</p>${p.thread?`<span class="thread">Show this thread</span>`:""}`;
  }
}
function postHTML(p,o={}){
  const u=U[p.by];let ctx="";
  if(o.rv)ctx=`<div class="fctx">${icon("rv","xs")}${esc(U[o.rv].name)} re-vouched</div>`;
  else if(p.t==="reply")ctx=`<div class="fctx">${icon("reply","xs")}Replying to @${U[p.to].h}</div>`;
  else if(p.ctx&&!o.noctx)ctx=`<div class="fctx">${icon("reply","xs")}${esc(p.ctx)}</div>`;
  return `<article class="fp" data-go="${p.t==="ask"?"ask":"thread"}" data-id="${p.id}">${ctx}<div class="phd"><button class="pav" data-act="rep" data-id="${u.id}" aria-label="${esc(u.name)}">${av(u,"md")}</button><div class="pid"><div class="nmrow"><button class="nm" data-act="rep" data-id="${u.id}">${esc(u.name)}</button>${u.cur?chk():""}<span class="hn">@${u.h}</span></div>${tok(u)}</div><span class="tm">${ago(o.min||p.min)}</span></div>${body(p)}${acts(p)}</article>`;
}
function miniReply(r,pid){
  const u=U[r.by];
  return `<article class="post"><button class="pav" data-act="rep" data-id="${u.id}">${av(u)}</button><div class="pc">${head(u,r.min)}${note(r.text)}${r.w?attach(W[r.w],r.by,"",true):""}<div class="acts"><button class="a" data-act="reply" data-id="${pid}">${icon("reply")}</button><button class="a" data-act="toast" data-id="Re-vouched.">${icon("rv")}</button><button class="a" data-act="toast" data-id="Starred.">${icon("star")}<span>${r.st||""}</span></button><button class="a" data-act="share">${icon("share")}</button></div></div></article>`;
}

/* ---------- screens ---------- */
function home(){
  const items=S.feed==="following"
   ?FOLLOWING.filter(it=>it.rv?(S.follows.has(it.rv)&&S.showRv):(S.follows.has(POSTS[it.id].by)||POSTS[it.id].ctx))
   :EVERYONE.map(id=>({id}));
  let h=`<div class="home-top"><div class="row1"><button data-tab="me" aria-label="Me">${av(U.me,"sm")}</button><span class="mark">vouch${chk("")}</span><span></span></div>
  <div class="ttabs" role="tablist"><button class="${S.feed==="following"?"on":""}" role="tab" aria-selected="${S.feed==="following"}" data-act="feed" data-id="following">Following</button><button class="${S.feed==="everyone"?"on":""}" role="tab" aria-selected="${S.feed==="everyone"}" data-act="feed" data-id="everyone">Everyone</button></div></div>`;
  if(S.feed==="following")h+=`<div class="live" data-go="live"><span class="pulse"></span><span class="grow"><b>Tobias is live</b> · Side B, together · ${LIVE.listening} listening</span><span class="btn sm ghost">Join</span></div>`;
  const dayOf=m=>m<1440?"Today":m<2880?"Yesterday":"Sunday";let day="";
  for(const it of items){const m=it.min||POSTS[it.id].min,d=dayOf(m);if(d!==day){day=d;const n=items.filter(x=>dayOf(x.min||POSTS[x.id].min)===d).length;h+=`<div class="day"><span>${d}</span><span>${n} post${n===1?"":"s"}</span></div>`;}h+=postHTML(POSTS[it.id],{rv:it.rv,min:it.min});}
  const ppl=new Set(items.map(it=>it.rv||POSTS[it.id].by)).size;
  return h+`<div class="end">${chk("")}<b>You’re caught up.</b><p>${S.feed==="following"?`${items.length} posts from ${ppl} people you follow since Sunday. Newest first, nothing ranked.`:`Everything posted on Vouch since Sunday, newest first.`}</p></div>`;
}

  const p=POSTS[id],u=U[p.by],w=p.w?W[p.w]:null,f=S.follows.has(u.id),reps=REPLIES[id]||[];
  const s=S.star.has(id),rv=S.rv.has(id);
  let main="";
  if(p.t==="pick"){
    const app=appFor(w),others=CHOICES[w.m].filter(a=>a!==app),rate=w.aff[app];
    main=`${p.text?`${note(p.text,"lg")}<div class="sign"><span>${esc(u.name)}</span></div>`:""}
    <div class="card big" style="--tint:${w.art.c[0]}"><div class="hero">${cover(w)}${stretch(w)?`<span class="new">${esc(stretch(w))}</span>`:""}</div><div class="cmeta"><span class="kick">${ONE[w.m]} · ${w.year} · ${esc(w.spec)}</span><span class="att-t">${esc(w.title)}</span><span class="att-b">${esc(w.by)}</span><span class="hm">${icon("shield","xs")}Human-made · checked by ${esc(first(u.name))}</span></div>
     <div class="openbar"><button class="btn acc wide" data-act="open" data-id="${w.id}" data-by="${u.id}">${icon("ext")}Open in ${APPS[app]}</button>
     ${others.some(a=>w.on.includes(a))?`<div class="also"><span>Also in</span>${others.filter(a=>w.on.includes(a)).map(a=>`<button data-act="open" data-id="${w.id}" data-by="${u.id}" data-app="${a}">${APPS[a]}</button>`).join("")}</div>`:""}</div>

  ${p.t==="pick"?repLine(u):""}${main}

    <p class="foot">Change your default in Settings, under Open in.</p>`;

/* ---------- the "Open in" handoff ---------- */
let hoTimer;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function handoff(d){
  closeSheet();
  const w=W[d.id],app=d.app||appFor(w),c=U[d.by],rate=w.aff[app];
  S.ho={id:w.id,by:d.by,app,at:d.at,phase:"opening"};
  const el=$("#handoff");el.hidden=false;el.classList.add("show");
  el.innerHTML=`<div class="ho-open" role="dialog" aria-label="Opening in ${APPS[app]}">${cover(w)}<div><div class="att-t">${esc(w.title)}</div><div class="att-b">${esc(w.by)}</div></div>
   <div class="track"><span>Vouch</span><span class="ln"><i></i></span><span class="to">${APPS[app]}</span></div>
   <div><b>Opening in ${APPS[app]}${d.at?` at ${d.at}`:""}</b><p class="note">${rate?`${esc(first(c.name))} earns ${rate} if you buy through ${APPS[app]}.`:`No affiliate link. ${esc(first(c.name))} earns nothing from this.`}</p></div>
   <button class="lk" data-act="hocancel">Cancel</button></div>
   <div class="ho-out" aria-hidden="true"><button class="ho-b2a" data-act="return">${icon("back","xs")}Vouch</button><span class="glyph">${icon(w.m)}</span><h2>${APPS[app]}</h2><p>${esc(w.title)} is open in ${APPS[app]}. This prototype stops at the handoff and doesn’t show other apps.</p><button class="btn" data-act="return">Return to Vouch</button></div>`;
  clearTimeout(hoTimer);
  hoTimer=setTimeout(()=>{
    S.ho.phase="out";
    $("#screen").classList.add("away");$("#app").classList.add("outside");
    const out=el.querySelector(".ho-out");out.classList.add("in");out.removeAttribute("aria-hidden");
    el.querySelector(".ho-open").style.opacity="0";
    document.querySelector(".status .b2a").hidden=false;
  },reduce?500:1350);
  renderRail();
}
function returnFromApp(){
  if(!S.ho)return;
  const d=S.ho,el=$("#handoff");
  $("#screen").classList.remove("away");$("#app").classList.remove("outside");
  document.querySelector(".status .b2a").hidden=true;
  const out=el.querySelector(".ho-out");if(out)out.classList.remove("in");
  setTimeout(()=>{el.hidden=true;el.classList.remove("show");el.innerHTML="";S.ho=null;openSheet("land",d);},reduce?0:420);
}
function cancelHandoff(){clearTimeout(hoTimer);document.querySelector(".status .b2a").hidden=true;$("#screen").classList.remove("away");$("#app").classList.remove("outside");const el=$("#handoff");el.hidden=true;el.classList.remove("show");el.innerHTML="";S.ho=null;renderRail();}

 ["home","Home","Following, newest first. It ends."],

   ask:()=>{S.tab="home";S.stack=[{n:"ask",id:"ask_rae"}];},club:()=>{S.tab="discover";S.stack=[{n:"club",id:"slowcinema"}];},live:()=>{S.tab="home";S.stack=[{n:"live"}];},

/* ---------- actions ---------- */
function act(a,d){
  const id=d.id;
  switch(a){
    case "back":S.replyTo=null;back();break;
    case "close":closeSheet();break;
    case "feed":S.feed=id;render();break;
    case "rep":openSheet("rep",{id});break;
    case "viewprofile":closeSheet();S.ptab="picks";if(id==="me")setTab("me");else go("profile",id);break;
    case "follow":{const u=U[id];if(S.follows.has(id)){S.follows.delete(id);toast(`Unfollowed ${first(u.name)}.`);}else{S.follows.add(id);toast(`Following ${first(u.name)}. Their posts land in Home, newest first.`);}render();if(S.sheet==="rep")openSheet("rep",{id});break;}
    case "star":S.star.has(id)?S.star.delete(id):S.star.add(id);render();break;
    case "revouch":if(S.rv.has(id)){S.rv.delete(id);toast("Re-vouch removed.");}else{S.rv.add(id);toast("Re-vouched to your followers.");}render();break;
    case "save":if(S.save.has(id)){S.save.delete(id);toast("Removed from Saved.");}else{S.save.add(id);toast("Saved. Find it under Me.");}render();break;
    case "share":toast("Link copied.");break;
    case "toast":toast(id);break;
    case "reply":S.replyTo=id;S.ctype="share";go("compose");break;
    case "answer":S.replyTo=null;S.ctype="share";toast("Pick something from a list, then add your reason.");break;
    case "compose":S.replyTo=null;S.ctype="share";S.cwork="lowceil";go("compose");break;
    case "ctype":S.ctype=id;render();break;
    case "verdict":S.verdict=id;render();break;
    case "publish":S.replyTo=null;back();toast("Posted. (Posts aren’t stored in the prototype.)");break;
    case "open":handoff({id,by:d.by,app:d.app,at:d.at});break;
    case "chooser":openSheet("chooser",{id,by:d.by});break;
    case "hocancel":cancelHandoff();break;
    case "return":returnFromApp();break;
    case "landed":{const w=S.lastLand;closeSheet();if(id==="later"){toast("We’ll ask again tomorrow.");break;}toast(`Counted. ${id==="meh"?"Honest answers keep the landed rate honest.":"That adds to the curator’s landed rate."}`);if(id!=="meh")setTimeout(()=>openSheet("landthanks",{id:w}),350);break;}
    case "triedpost":closeSheet();S.replyTo=null;S.ctype="tried";S.cwork=S.lastLand||"lowceil";go("compose");break;
    case "join":if(S.joined.has(id)){S.joined.delete(id);toast("Left the club.");}else{S.joined.add(id);toast("Joined. The weekly pick shows up in Home.");}render();break;
    case "ptab":S.ptab=id;render();break;
    case "atab":S.atab=id;render();break;
    case "mtab":S.mtab=id;render();break;
    case "defsheet":openSheet("def",{id});break;
    case "setdef":S.def[id]=d.app;closeSheet();render();toast(`${MEDIA[id]} now opens in ${APPS[d.app]}.`);break;
    case "toggleai":S.ai=!S.ai;render();toast(S.ai?"Your assistant can read your follows and saved picks.":"Your assistant can’t read Vouch.");break;
    case "start":S.welcome=false;S.tab="home";S.feed="following";render();toast("Following Mara’s circle.");break;
    case "togglerv":S.showRv=!S.showRv;render();break;
  }
}

document.addEventListener("click",e=>{
  const th=e.target.closest("[data-theme-set]");
  if(th){const v=th.dataset.themeSet,r=document.documentElement;if(v==="auto")delete r.dataset.theme;else r.dataset.theme=v;renderRail();return;}
  const j=e.target.closest("[data-jump]");if(j){jump(j.dataset.jump);return;}
  const a=e.target.closest("[data-act]");if(a){if(a.disabled)return;e.stopPropagation();act(a.dataset.act,a.dataset);return;}
  const t=e.target.closest("[data-tab]");if(t){closeSheet();setTab(t.dataset.tab);return;}
  const g=e.target.closest("[data-go]");if(g){closeSheet();go(g.dataset.go,g.dataset.id);}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(S.ho)S.ho.phase==="out"?returnFromApp():cancelHandoff();else if(S.sheet)closeSheet();}});
render();
</script>
</body>
</html>

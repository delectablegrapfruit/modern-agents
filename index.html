<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vouch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&family=Mrs+Saint+Delafield&display=swap">
<style>
/* Layout: on wide screens a desk holds a prototype rail beside a phone frame; on phones the app runs alone, edge to edge */
:root{
  --paper:#ffffff;
  --ground:#f1f1ec;
  --desk:#e6e6df;
  --ink:#141413;
  --ink-2:#4a4a45;
  --muted:#77776f;
  --line:#e2e2da;
  --sticker:#ffd23f;
  --on-sticker:#141413;
  --scrim:rgba(20,20,19,.45);
  --av-s:36%;--av-l:86%;--av-s2:42%;--av-l2:26%;
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --body:'Hanken Grotesk',ui-sans-serif,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --mono:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sign:'Mrs Saint Delafield','Snell Roundhand','Brush Script MT',cursive;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#171716;--ground:#0d0d0c;--desk:#080808;--ink:#f1f1ec;--ink-2:#c3c3bc;--muted:#8d8d86;--line:#2b2b28;
    --scrim:rgba(0,0,0,.6);--av-s:24%;--av-l:24%;--av-s2:45%;--av-l2:82%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#171716;--ground:#0d0d0c;--desk:#080808;--ink:#f1f1ec;--ink-2:#c3c3bc;--muted:#8d8d86;--line:#2b2b28;
  --scrim:rgba(0,0,0,.6);--av-s:24%;--av-l:24%;--av-s2:45%;--av-l2:82%;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- desk, rail, phone ---------- */
.desk{height:100%;display:flex;align-items:center;justify-content:center;gap:56px}
.rail{display:none}
#phone{position:relative;width:100%;height:100%}
#app{position:relative;height:100%;display:flex;flex-direction:column;background:var(--paper);overflow:hidden}
.status{display:none}
@media (min-width:560px){
  .desk{padding-block:24px;padding-inline:16px}
  #phone{width:398px;flex:none;height:min(860px,100%);border-radius:58px;padding:11px;background:#0e0e0d;box-shadow:inset 0 0 0 1.5px #34332f,0 50px 100px -30px rgba(0,0,0,.45)}
  #app{border-radius:47px}
  .status{display:flex;align-items:center;justify-content:space-between;flex:none;height:48px;padding:6px 30px 0 34px;font:600 15px var(--body);background:var(--paper);position:relative;z-index:8}
  .status .island{position:absolute;left:50%;top:10px;width:110px;height:32px;border-radius:20px;background:#0e0e0d;transform:translateX(-50%)}
  .status .sys{display:flex;gap:6px;align-items:center}
  .status svg{height:12px;width:auto;fill:var(--ink)}
}
@media (min-width:980px){
  .rail{display:flex;flex-direction:column;gap:22px;width:292px;flex:none;max-height:100%;overflow:auto;padding-block:8px}
}
.rail .brand{font-size:28px}
.rail .thesis{font:600 19px/1.28 var(--display);letter-spacing:-.015em;text-wrap:balance}
.rail h2{font:500 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.jumps{display:flex;flex-direction:column;gap:2px}
.jump{display:grid;grid-template-columns:22px 1fr;gap:0 8px;text-align:left;background:none;border:0;border-radius:12px;padding:8px 10px}
.jump .n{grid-row:span 2;font:500 11px/20px var(--mono);color:var(--muted)}
.jump b{font:600 14px/20px var(--body)}
.jump span{font-size:12.5px;line-height:1.35;color:var(--muted)}
.jump:hover{background:color-mix(in srgb,var(--paper) 55%,transparent)}
.jump.on{background:var(--paper)}
.jump.on .n{color:var(--ink)}
.rail .fine{font-size:12px;color:var(--muted);line-height:1.5}

/* ---------- shared ---------- */
#view{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--ground);position:relative}
.sp{flex:1}
.brand{display:inline-flex;align-items:center;gap:5px;font:800 25px/1 var(--display);letter-spacing:-.035em}
.brand svg{width:15px;height:15px;transform:translateY(-6px)}
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:16px;height:16px}
.vp{width:16px;height:16px;flex:none}
.vp.lg{width:40px;height:40px}
.vp-bg{fill:var(--sticker)}
.vp-ck{fill:none;stroke:var(--on-sticker);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;padding:0;flex:none;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 14px/1.2 var(--body);border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 16px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sticker{background:var(--sticker);border-color:var(--sticker);color:var(--on-sticker)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.wide{width:100%;padding:14px;font-size:15px}
.btn[disabled]{opacity:.35;cursor:default}
.link{background:none;border:0;padding:0;font:600 13px var(--body);color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.kick{display:flex;align-items:center;gap:6px;font:500 11px/1.3 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kick .i{width:14px;height:14px}

.av{--sz:38px;width:var(--sz);height:var(--sz);border-radius:50%;flex:none;display:grid;place-items:center;font:700 calc(var(--sz)*.34)/1 var(--display);letter-spacing:.01em;background:hsl(var(--h) var(--av-s) var(--av-l));color:hsl(var(--h) var(--av-s2) var(--av-l2))}
.av.xs{--sz:22px}.av.sm{--sz:30px}.av.md{--sz:52px}.av.lg{--sz:80px}
.avf circle.n{fill:hsl(var(--h) var(--av-s) var(--av-l))}
.avf text{fill:hsl(var(--h) var(--av-s2) var(--av-l2));font:700 11px var(--display)}

.bar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:2px;min-height:54px;padding:6px 6px 6px 16px;background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar.back{padding-left:4px}
.bar h1{flex:1;min-width:0;margin:0;font:700 17px/1.2 var(--display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{background:var(--paper);padding:18px 16px 12px}
.big h1{margin:0 0 4px;font:800 31px/1.05 var(--display);letter-spacing:-.03em}
.big p{color:var(--muted);font-size:14px;max-width:38ch}
.sec{display:flex;align-items:baseline;gap:8px;padding:20px 16px 8px;font:700 16px/1.2 var(--display);letter-spacing:-.01em}
.sec small{font:500 12.5px var(--body);color:var(--muted);letter-spacing:0}
.panel{background:var(--paper)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px}
.row+.row{border-top:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.row .sub{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none;background:var(--paper)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--paper);font:600 13px var(--body)}
.chip .i{width:15px;height:15px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .c{font-weight:500;opacity:.6}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}

/* ---------- covers ---------- */
.cv{display:block;height:auto}
.cv.film,.cv.book{aspect-ratio:2/3}
.cv.music{aspect-ratio:1}
.cv.art{aspect-ratio:4/5}
.cv.book{border-radius:2px 5px 5px 2px}
.sv-d{font-family:var(--display);font-weight:800;letter-spacing:-.02em}
.sv-b{font-family:var(--display);font-weight:700;letter-spacing:-.015em}
.sv-m{font-family:var(--mono);font-weight:500}

.stage{display:flex;justify-content:center;align-items:center;padding:24px 16px;background:color-mix(in srgb,var(--tint) 20%,var(--paper));cursor:pointer}
.stage .cv{box-shadow:0 14px 30px -12px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.12)}
.stage .cv.film{height:250px}
.stage .cv.book{height:236px}
.stage .cv.music{height:226px}
.stage .cv.art{height:244px;box-shadow:0 18px 30px -16px rgba(0,0,0,.5),0 3px 4px rgba(0,0,0,.15)}
.stage.art{background:color-mix(in srgb,var(--tint) 10%,color-mix(in srgb,var(--ground) 70%,var(--paper)))}

/* ---------- home ---------- */
.stories{display:flex;gap:12px;overflow-x:auto;padding:12px 16px 14px;background:var(--paper);scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:68px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0}
.ring{position:relative;width:66px;height:66px;border-radius:50%;padding:3px;border:2.5px solid var(--line);display:grid;place-items:center}
.ring.new{border-color:var(--sticker)}
.ring.add{border-style:dashed;color:var(--muted)}
.ring .av{--sz:54px}
.ring .md{position:absolute;right:-3px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:0 0 0 1.5px var(--line)}
.ring .md .i{width:13px;height:13px}
.story .sn{font-size:12px;line-height:1.1;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.rule{display:flex;align-items:center;gap:8px;width:100%;border:0;border-top:1px solid var(--line);background:var(--paper);padding:10px 16px;font:500 11.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left}
.rule .i{width:15px;height:15px}
.day{padding:18px 16px 8px;font:500 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.card{background:var(--paper);margin-bottom:8px}
.ph{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;cursor:pointer}
.who{flex:1;min-width:0}
.nm{display:flex;align-items:center;gap:4px;min-width:0}
.nm .t{font-weight:700;font-size:14.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font:500 11px/1.4 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ago{font-size:12.5px;color:var(--muted);flex:none}
.pb{padding:14px 16px 2px;cursor:pointer}
.pb h3{margin:0;font:700 21px/1.15 var(--display);letter-spacing:-.02em;text-wrap:balance}
.byl{font-size:13.5px;color:var(--muted);margin-top:3px}
.venue{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-2);margin-top:6px}
.venue .i{width:15px;height:15px}
.note{font-size:15.5px;line-height:1.5;margin-top:10px;max-width:62ch}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sig{font:400 34px/1 var(--sign);text-align:right;padding:2px 4px 0 0;transform:rotate(-3deg);transform-origin:right center;white-space:nowrap}
.sig.lg{font-size:42px}
.also{display:flex;align-items:center;gap:8px;padding:6px 16px 0;font-size:12.5px;color:var(--muted)}
.also .av{box-shadow:0 0 0 2px var(--paper)}
.also .av+.av{margin-left:-14px}
.acts{display:flex;align-items:center;gap:2px;padding:6px 8px 10px}
.ab{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:8px;border-radius:999px;font:500 13.5px var(--body);color:var(--ink-2)}
.ab.on{color:var(--ink);font-weight:600}
.ab.buy{border:1.5px solid var(--line);padding:6px 12px 6px 10px;color:var(--ink);font-weight:600;font-size:13px;margin-right:6px}
.ab.buy .i{width:18px;height:18px}

.vouch{padding:4px 16px 16px}
.vpair{display:flex;align-items:center;justify-content:center;gap:0;padding:6px 0 12px}
.vline{flex:1;max-width:56px;height:0;border-top:1.5px dashed var(--muted)}
.vpair .vp{margin:0 4px}
.vq{font:600 19px/1.32 var(--display);letter-spacing:-.012em;text-align:center;text-wrap:balance;padding:0 6px}
.vwho{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px;border:1.5px solid var(--line);border-radius:14px 14px 0 0;cursor:pointer}
.strip{display:flex;gap:6px;align-items:flex-end;justify-content:center;padding:12px;border:1.5px solid var(--line);border-top:0;border-radius:0 0 14px 14px;background:color-mix(in srgb,var(--ground) 60%,var(--paper));cursor:pointer}
.strip .cv{height:82px;box-shadow:0 6px 12px -8px rgba(0,0,0,.5)}
.strip .cv.music{height:72px}

.lu{padding:2px 16px 14px}
.lu-t{font-size:15px;line-height:1.5}
.slots{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none;align-items:flex-end}
.slots::-webkit-scrollbar{display:none}
.slot{position:relative;flex:none;cursor:pointer}
.slot .cv{height:64px}
.slot .n{position:absolute;left:-4px;top:-8px;z-index:1;min-width:20px;height:20px;border-radius:10px;background:var(--paper);box-shadow:0 0 0 1.5px var(--line);font:500 10.5px/20px var(--mono);text-align:center;padding:0 4px}
.slot.in .cv{box-shadow:0 0 0 3px var(--sticker)}
.slot.in .n{background:var(--sticker);color:var(--on-sticker);box-shadow:none}
.slot.out{opacity:.45;filter:grayscale(1)}
.slot.out::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;border-top:2px solid var(--ink);transform:rotate(-14deg)}
.lu-note{font-size:12.5px;color:var(--muted);padding-top:6px}

.stage.set{align-items:flex-end;gap:14px;padding:26px 12px 18px}
.stage.set figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.stage.set .cv.film{height:172px}
.stage.set .cv.music{height:118px}
.stage.set .cv.book{height:150px}
.stage.set figcaption{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.locked{position:relative;margin-top:10px;min-height:118px}
.locked .note{margin:0}
.blur{filter:blur(6px);opacity:.55;user-select:none;-webkit-user-select:none;pointer-events:none}
.lk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-weight:600;font-size:13.5px}

.stage.evs{padding:22px 16px;cursor:default}
.ticket{display:flex;width:100%;max-width:340px;background:var(--paper);border-radius:14px;box-shadow:0 12px 26px -14px rgba(0,0,0,.4);overflow:hidden}
.stub{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--sticker);color:var(--on-sticker);border-right:2px dashed color-mix(in srgb,var(--on-sticker) 35%,transparent);padding:12px 0}
.stub span{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.stub b{font:800 34px/1 var(--display);letter-spacing:-.03em}
.tk{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tk-t{font:700 16.5px/1.2 var(--display);letter-spacing:-.01em}
.tk-m{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted)}
.tk-m .i{width:14px;height:14px}
.seats{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:4px}
.seats i{display:block;height:100%;background:var(--ink)}

.endcap{padding:30px 24px 40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.endcap h3{margin:4px 0 0;font:800 23px/1.1 var(--display);letter-spacing:-.025em}
.endcap p{color:var(--muted);font-size:14px;max-width:32ch}

/* ---------- discover ---------- */
.search{position:relative;padding:0 16px 10px;background:var(--paper)}
.search .i{position:absolute;left:28px;top:11px;width:18px;height:18px;color:var(--muted)}
.inp{width:100%;font:15px var(--body);padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--ground);color:var(--ink)}
.search .inp{padding-left:38px;border-color:transparent}
.inp:focus{outline:2px solid var(--ink);outline-offset:0;border-color:transparent}
.graph{background:var(--paper);padding:4px 8px 12px}
.graph svg{display:block;width:100%;height:auto;max-width:360px;margin:0 auto}
.graph .e{stroke:var(--ink-2);stroke-width:1.4;opacity:.35}
.graph .v{stroke:var(--muted);stroke-width:1.4;stroke-dasharray:3 4}
.graph .out circle.n{fill:var(--paper);stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 3}
.graph .out text{fill:var(--muted)}
.graph .lb{font:500 10px var(--body);fill:var(--ink-2)}
.graph .me circle{fill:var(--ink)}
.graph .me text{fill:var(--paper);font:700 11px var(--display)}
.graph g[data-go]{cursor:pointer}
.legend{display:flex;justify-content:center;gap:18px;font-size:12.5px;color:var(--muted);padding-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--ink-2)}
.legend i.o{background:transparent;border:1.5px dashed var(--muted)}
.pcard{background:var(--paper);padding:14px 16px 16px;margin-bottom:8px}
.pcard .top{display:flex;align-items:center;gap:12px;cursor:pointer}
.pq{margin-top:12px;font:600 16.5px/1.35 var(--display);letter-spacing:-.01em}
.pq-by{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.pcard .strip{border:0;border-radius:12px;margin-top:12px;justify-content:flex-start}
.pips{display:flex;gap:4px;margin-top:4px}
.pips i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--sticker)}
.az{font:500 11px var(--mono);letter-spacing:.09em;color:var(--muted);padding:10px 16px 2px;background:var(--paper)}

/* ---------- curator ---------- */
.shelf{display:flex;gap:6px;align-items:flex-end;justify-content:center;height:150px;padding:0 16px 48px;background:color-mix(in srgb,var(--tint) 22%,var(--paper));overflow:hidden}
.shelf .cv{height:84px;flex:none;box-shadow:0 8px 14px -8px rgba(0,0,0,.5)}
.shelf .cv.music{height:72px}
.phead{background:var(--paper);padding:0 16px 16px}
.phead .av{margin-top:-40px;box-shadow:0 0 0 4px var(--paper)}
.pname{display:flex;align-items:center;gap:6px;margin-top:10px}
.pname h2{margin:0;font:800 25px/1.1 var(--display);letter-spacing:-.03em}
.vbadge{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:3px 9px 3px 5px;border-radius:999px;background:var(--ground);font:600 12px var(--body);color:var(--ink-2)}
.role{font-size:13.5px;color:var(--muted);margin-top:6px}
.pline{font:600 17px/1.3 var(--display);letter-spacing:-.01em;margin-top:12px;text-wrap:balance}
.bio{font-size:14.5px;line-height:1.5;color:var(--ink-2);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:16px 0;padding:12px 0;border-block:1px solid var(--line)}
.stats div{display:flex;flex-direction:column;align-items:center;gap:1px}
.stats b{font:700 18px/1.2 var(--display);font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;color:var(--muted)}
.brow{display:flex;gap:8px}
.brow .btn{flex:1}

 flag:'<path d="M5 21V4.5M5 4.5h11l-2 4 2 4H5"/>',

const icon=(n,c="")=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const ROSETTE=(()=>{let d="";for(let i=0;i<24;i++){const r=i%2?9.1:11,a=Math.PI*2*i/24-Math.PI/2;d+=(i?"L":"M")+(12+r*Math.cos(a)).toFixed(2)+" "+(12+r*Math.sin(a)).toFixed(2);}return d+"Z";})();

const av=(c,cls="")=>`<span class="av ${cls}" style="--h:${c.hue}">${esc(c.ini)}</span>`;

/* ---------- cover art, drawn per medium ---------- */
let UID=0;
const hash=s=>{let h=7;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;return h;};
function rng(seed){let s=seed%2147483646+1;return()=>(s=s*16807%2147483647)/2147483647;}
function wrap(t,n){const out=[];let line="";for(const w of t.split(" ")){if(line&&(line+" "+w).length>n){out.push(line);line=w;}else line=line?line+" "+w:w;}if(line)out.push(line);return out;}
const fitSize=(lines,width,k,max)=>Math.min(max,width/(Math.max(...lines.map(l=>l.length))*k));
const txt=(x,y,cls,size,fill,s,extra="")=>`<text x="${x}" y="${y.toFixed(1)}" class="${cls}" font-size="${size.toFixed(1)}" fill="${fill}"${extra}>${esc(s)}</text>`;
function grain(n,w,h,fill,op,seed){const r=rng(seed);let o="";for(let i=0;i<n;i++)o+=`<circle cx="${(r()*w).toFixed(1)}" cy="${(r()*h).toFixed(1)}" r="${(.35+r()*.6).toFixed(2)}" fill="${fill}" opacity="${op}"/>`;return o;}
const svgWrap=(w,vb,body,label)=>`<svg class="cv ${w.m}" viewBox="${vb}" role="img" aria-label="${esc(label)}">${body}</svg>`;
function cover(w){return ({film:filmCv,book:bookCv,music:musicCv,art:artCv})[w.m](w,++UID);}

function filmCv(w,u){
  const [a,b,f,x]=w.art.c,r=rng(hash(w.title));let m="";
  switch(w.art.k){
    case "lighthouse":m=`<rect y="196" width="200" height="104" fill="${b}"/><path d="M137 125L0 88V156Z" fill="${f}" opacity=".16"/><rect x="131" y="122" width="12" height="76" fill="${f}"/><rect x="128" y="111" width="18" height="11" fill="${x}"/><circle cx="46" cy="58" r="2.6" fill="${f}" opacity=".8"/><circle cx="168" cy="44" r="1.8" fill="${f}" opacity=".6"/>`;break;
    case "field":m=`<circle cx="100" cy="192" r="60" fill="${x}"/><rect y="192" width="200" height="108" fill="${b}"/>`+[204,216,232,254].map((y,i)=>`<rect y="${y}" width="200" height="${(1+i*.7).toFixed(1)}" fill="${f}" opacity=".26"/>`).join("");break;
    case "trees":m=`<rect y="206" width="200" height="94" fill="${x}"/>`+Array.from({length:9},(_,i)=>{const h=40+r()*72;return `<rect x="${22+i*19}" y="${(206-h).toFixed(1)}" width="4" height="${h.toFixed(1)}" fill="${f}"/>`;}).join("");break;
    case "door":m=`<rect y="198" width="200" height="102" fill="${b}" opacity=".7"/><rect x="68" y="72" width="64" height="126" fill="${x}"/><rect x="68" y="72" width="64" height="126" fill="none" stroke="${f}" stroke-width="2"/><circle cx="121" cy="138" r="3" fill="${f}"/>`;break;
    case "wave":m=`<circle cx="100" cy="96" r="30" fill="${x}" opacity=".9"/>`+[0,1,2,3,4,5].map(i=>`<path d="M-10 ${150+i*14}Q40 ${138+i*14} 90 ${150+i*14}T190 ${150+i*14}T290 ${150+i*14}" fill="none" stroke="${f}" stroke-width="2" opacity="${(1-i*.13).toFixed(2)}"/>`).join("");break;
    case "windows":{m=`<rect x="46" y="54" width="108" height="150" fill="${b}"/>`;for(let yy=0;yy<7;yy++)for(let xx=0;xx<4;xx++){const lit=r()>.62;m+=`<rect x="${56+xx*24}" y="${64+yy*19}" width="16" height="11" fill="${lit?x:f}" opacity="${lit?1:.1}"/>`;}break;}
  }
  const lines=wrap(w.title.toUpperCase(),10),fs=fitSize(lines,172,.66,36);
  const t=lines.map((l,i)=>txt(14,286-(lines.length-1-i)*fs*.94,"sv-d",fs,f,l)).join("");
  return svgWrap(w,"0 0 200 300",`<defs><linearGradient id="g${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="200" height="300" fill="url(#g${u})"/>${m}${txt(14,24,"sv-m",6.6,f,("A film by "+w.by).toUpperCase(),' letter-spacing="1.2" opacity=".8"')}${t}`,w.title+", poster");
}
function bookCv(w,u){
  const [bg,fg,x]=w.art.c;let m="";
  switch(w.art.k){
    case "window":m=`<rect x="112" y="168" width="62" height="86" fill="none" stroke="${x}" stroke-width="3"/><path d="M143 168V254M112 211H174" stroke="${x}" stroke-width="2"/>`;break;
    case "lines":m=[0,1,2,3,4,5].map(i=>`<rect x="22" y="${178+i*12}" width="${156-i*22}" height="3" fill="${x}"/>`).join("");break;
    case "house":m=`<rect x="28" y="178" width="68" height="76" fill="${x}"/><rect x="104" y="178" width="68" height="76" fill="none" stroke="${x}" stroke-width="3"/>`;break;
    case "dot":m=`<circle cx="148" cy="212" r="28" fill="${x}"/>`;break;
    case "stripe":m=`<path d="M0 250L200 170V196L0 276Z" fill="${x}"/>`;break;
    case "photo":m=`<defs><linearGradient id="p${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${x}"/><stop offset=".6" stop-color="#e9ecec"/><stop offset=".61" stop-color="#6f8793"/><stop offset="1" stop-color="#3e4f58"/></linearGradient></defs><rect x="22" y="132" width="156" height="118" fill="url(#p${u})"/>`;break;
  }
  const lines=wrap(w.title,12),fs=fitSize(lines,158,.56,25);
  return svgWrap(w,"0 0 200 300",`<rect width="200" height="300" fill="${bg}"/>${m}${lines.map((l,i)=>txt(22,40+fs+i*fs*1.08,"sv-b",fs,fg,l)).join("")}${txt(22,284,"sv-m",7.4,fg,w.by.toUpperCase(),' letter-spacing=".9" opacity=".85"')}<rect width="7" height="300" fill="#000" opacity=".16"/><rect x="7" width="1" height="300" fill="#fff" opacity=".22"/>`,w.title+", cover");
}
function musicCv(w,u){
  const [bg,fg,x,y]=w.art.c,r=rng(hash(w.title));let m="";
  switch(w.art.k){
    case "ceiling":m=`<rect width="300" height="44" fill="${fg}"/><rect y="56" width="300" height="28" fill="${fg}"/><rect y="94" width="300" height="16" fill="${fg}"/><rect y="118" width="300" height="7" fill="${fg}"/><circle cx="246" cy="182" r="11" fill="${x}"/>`;break;
    case "glass":m=`<circle cx="118" cy="112" r="80" fill="${x}" opacity=".6"/><circle cx="188" cy="132" r="68" fill="${y||x}" opacity=".5"/><circle cx="142" cy="166" r="50" fill="${fg}" opacity=".16"/>`;break;
    case "tape":m=`<rect x="40" y="44" width="220" height="140" rx="12" fill="${fg}"/><rect x="58" y="60" width="184" height="50" rx="3" fill="${bg}"/><rect x="58" y="72" width="184" height="6" fill="${x}"/><rect x="92" y="128" width="116" height="36" rx="18" fill="none" stroke="${bg}" stroke-width="3"/><circle cx="116" cy="146" r="11" fill="${bg}"/><circle cx="184" cy="146" r="11" fill="${bg}"/>`;break;
    case "rings":m=[100,82,64,46,28].map((rr,i)=>`<circle cx="150" cy="114" r="${rr}" fill="${i%2?bg:fg}"/>`).join("")+`<circle cx="150" cy="114" r="9" fill="${x}"/>`;break;
    case "split":m=`<rect width="300" height="118" fill="${x}"/><circle cx="150" cy="118" r="60" fill="${fg}"/>`;break;
    case "bars":m=Array.from({length:11},(_,i)=>{const h=30+r()*150;return `<rect x="${22+i*24}" y="${(196-h).toFixed(1)}" width="14" height="${h.toFixed(1)}" fill="${x}"/>`;}).join("");break;
  }
  const lines=wrap(w.title,15),fs=fitSize(lines,262,.56,lines.length>1?24:30);
  const t=lines.map((l,i)=>txt(20,284-(lines.length-1-i)*fs*1.02,"sv-d",fs,fg,l)).join("");
  return svgWrap(w,"0 0 300 300",`<rect width="300" height="300" fill="${bg}"/>${m}${txt(20,284-lines.length*fs*1.02-4,"sv-m",10,fg,w.by.toUpperCase(),' letter-spacing="1" opacity=".85"')}${t}`,w.title+", cover");
}
function artCv(w,u){
  const a=w.art,c=a.c,r=rng(hash(w.title)),mat=a.mat,i=mat?24:9,W0=240-2*i,H0=300-2*i;let p="";
  switch(a.k){
    case "fields":p=`<defs><filter id="f${u}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.6"/></filter></defs><rect width="188" height="248" fill="${c[0]}"/><g filter="url(#f${u})"><rect x="16" y="16" width="156" height="64" rx="3" fill="${c[1]}"/><rect x="16" y="92" width="156" height="70" rx="3" fill="${c[2]}"/><rect x="16" y="174" width="156" height="58" rx="3" fill="${c[3]}"/></g>`;break;
    case "grid":p=`<rect width="188" height="248" fill="${c[0]}"/>`+Array.from({length:32},(_,k)=>`<rect x="12" y="${14+k*7}" width="164" height=".7" fill="${c[1]}" opacity="${(.45+r()*.4).toFixed(2)}"/>`).join("")+Array.from({length:12},(_,k)=>`<rect x="${(12+k*14.9).toFixed(1)}" y="14" width=".5" height="218" fill="${c[1]}" opacity=".2"/>`).join("");break;
    case "arc":p=`<rect width="188" height="248" fill="${c[0]}"/><path d="M22 236A150 150 0 0 1 172 86" fill="none" stroke="${c[1]}" stroke-width="42"/>`;break;
    case "riso":p=`<rect width="188" height="248" fill="${c[0]}"/><g style="mix-blend-mode:multiply"><circle cx="66" cy="92" r="40" fill="${c[1]}"/><circle cx="126" cy="112" r="36" fill="${c[1]}"/><rect x="62" y="124" width="8" height="84" fill="${c[2]}"/><rect x="122" y="140" width="8" height="68" fill="${c[2]}"/><circle cx="96" cy="166" r="30" fill="${c[2]}" opacity=".8"/><rect x="18" y="206" width="152" height="10" fill="${c[2]}" opacity=".7"/></g>${grain(80,188,248,"#000",.16,hash(w.title))}`;break;
    case "horizon":p=`<defs><linearGradient id="h${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[1]}"/><stop offset=".55" stop-color="${c[2]}"/><stop offset=".56" stop-color="${c[3]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient></defs><rect width="188" height="248" fill="url(#h${u})"/><rect y="136" width="188" height="1.4" fill="#fff" opacity=".55"/>${grain(120,188,248,"#fff",.22,hash(w.title))}`;break;
  }
  return svgWrap(w,"0 0 240 300",`<rect width="240" height="300" fill="${a.fr}"/>${mat?`<rect x="7" y="7" width="226" height="286" fill="${mat}"/>`:""}<svg x="${i}" y="${i}" width="${W0}" height="${H0}" viewBox="0 0 188 248" preserveAspectRatio="none">${p}</svg>`,w.title+", "+w.by);
}

/* ---------- navigation ---------- */
const cur=()=>S.stack[S.stack.length-1];
function go(n,p={}){S.stack.push({n,p});render();}
function back(){S.stack.pop();render();}
function setTab(t){S.welcome=false;S.tab=t;S.stack=[];render();}
let lastKey="";
function render(){
  const v=$("#view");
  const t=cur();
  const h=S.welcome?welcome():t?SCREENS[t.n](t.p):SCREENS[S.tab]();
  const key=S.welcome?"welcome":S.stack.length?S.stack.map(s=>s.n+(s.p.id||"")).join("/"):S.tab;
  const st=v.scrollTop;
  v.innerHTML=h;
  v.scrollTop=key===lastKey?st:0;
  lastKey=key;
  renderTabs();renderRail();
}
function renderTabs(){
  const el=$("#tabs");
  el.hidden=S.welcome;
  if(S.welcome)return;
  el.innerHTML=[["home","Home","home"],["discover","Discover","compass"],["events","Events","calendar"],["saved","Saved","bookmark"],["you","You",null]]
   .map(([k,l,ic])=>`<button class="${S.tab===k?"on":""}" data-tab="${k}" aria-current="${S.tab===k?"page":"false"}">${ic?icon(ic):av(ME)}${l}</button>`).join("");
}

/* ---------- feed items ---------- */
function head(c,meta,ago){
  return `<div class="ph" data-go="curator" data-id="${c.id}">${av(c)}<div class="who">${nameLine(c)}<div class="meta">${meta}</div></div>${ago?`<span class="ago">${esc(ago)}</span>`:""}</div>`;
}
function actions(id){
  const s=S.saved.has(id),n=(COMMENTS[id]||[]).length;
  return `<div class="acts"><button class="ab ${s?"on":""}" data-act="save" data-id="${id}" aria-pressed="${s}">${icon(s?"bookmarkF":"bookmark")}<span>${s?"Saved":"Save"}</span></button><button class="ab" data-go="pick" data-id="${id}" aria-label="${n} comments">${icon("comment")}<span>${n}</span></button><button class="ab" data-act="share" aria-label="Share">${icon("share")}</button><span class="sp"></span><button class="ab buy" data-act="where" data-id="${id}">${icon("bag")}Where to get it</button></div>`;
}
function pickPost(it){
  const w=W[it.id],c=C(w.c),r=rank(w.c,w.id),also=listsWith(w.id).filter(k=>k!==w.c).map(C);
  return `<article class="card">${head(c,`${ONE[w.m]}${r?` · List #${r}`:""}`,it.ago)}
  <div class="stage ${w.m}" style="--tint:${tint(w)}" data-go="pick" data-id="${w.id}">${cover(w)}</div>
  <div class="pb" data-go="pick" data-id="${w.id}"><h3>${esc(w.title)}</h3><div class="byl">${esc(byline(w))}</div>${w.venue?`<div class="venue">${icon("pin")}${esc(w.venue)}</div>`:""}<p class="note clamp">${esc(w.note)}</p><div class="sig" aria-label="Signed by ${esc(c.name)}">${esc(c.name)}</div></div>
  ${also.length?`<div class="also">${also.map(a=>av(a,"xs")).join("")}<span>Also on ${also.map(a=>esc(first(a.name))+"’s").join(" and ")} list</span></div>`:""}
  ${actions(w.id)}</article>`;
}
function vouchPost(it){
  const f=C(it.from),t=C(it.to),v=VOUCH.find(x=>x.from===it.from&&x.to===it.to),fol=S.follows.has(t.id);
  return `<article class="card">${head(f,"Vouched for a curator",it.ago)}
  <div class="vouch"><div class="vpair">${av(f,"md")}<span class="vline"></span>${vp("lg","Vouch")}<span class="vline"></span>${av(t,"md")}</div>
  <p class="vq">“${esc(v.why)}”</p>
  <div class="vwho" data-go="curator" data-id="${t.id}"><div class="who">${nameLine(t)}<div class="meta">${t.media.map(m=>MEDIA[m]).join(" · ")} · ${esc(t.city)}</div></div><button class="btn sm ${fol?"ghost":""}" data-act="follow" data-id="${t.id}">${fol?"Following":"Follow"}</button></div>
  <div class="strip" data-go="curator" data-id="${t.id}">${(LISTS[t.id]||[]).slice(0,4).map(k=>cover(W[k])).join("")}</div></div></article>`;
}
function listPost(it){
  const c=C(it.c),L=LISTS[it.c],inW=W[it.add],out=W[it.out];
  return `<article class="card">${head(c,`List update · ${L.length} of 10`,it.ago)}
  <div class="lu"><p class="lu-t"><b>${esc(inW.title)}</b> is in at #${L.indexOf(it.add)+1}. The list was full, so <b>${esc(out.title)}</b> retired after ${it.weeks} weeks.</p>
  <div class="slots">${L.map((k,i)=>`<div class="slot ${k===it.add?"in":""}" data-go="pick" data-id="${k}"><span class="n">${i+1}</span>${cover(W[k])}</div>`).join("")}<div class="slot out" aria-label="Retired: ${esc(out.title)}"><span class="n">out</span>${cover(out)}</div></div>

  ${actions(it.add)}</article>`;
}
function setPost(it){
  const c=C(it.c),sub=S.subs.has(c.id),ws=it.ids.map(k=>W[k]);
  return `<article class="card">${head(c,"Sunday Table · Sep 27",it.ago)}
  <div class="stage set" style="--tint:#c9a9b6">${ws.map(w=>`<figure data-go="pick" data-id="${w.id}">${cover(w)}<figcaption>${ONE[w.m]}</figcaption></figure>`).join("")}</div>
  <div class="pb" data-go="curator" data-id="${c.id}"><h3>Sisters, a lighthouse, a small room</h3><div class="byl">${ws.map(w=>esc(w.title)).join(" · ")}</div>
  ${sub?`<p class="note">${esc(it.note)}</p><div class="sig">${esc(c.name)}</div>`:`<div class="locked"><p class="note blur" aria-hidden="true">${esc(it.note)}</p><div class="lk">${icon("lock")}<span>Sunday notes are for subscribers</span><button class="btn sm sticker" data-act="subsheet" data-id="${c.id}">Subscribe · $${c.price} a month</button></div></div>`}</div>

function eventPost(it){
  const e=EV.find(x=>x.id===it.id),c=C(e.c),has=S.seats.has(e.id);

function ticket(e){
  const pct=e.cap?Math.round((e.cap-e.left)/e.cap*100):0;

}

function graph(){

  <div class="panel payout" style="margin-top:8px"><div class="box"><div class="kick">October payout · paid Nov 1</div><div class="bignum">$2,914.60</div><div class="delta">Up $286 from September</div>
   <div class="split" role="img" aria-label="Payout by source"><i class="a" style="width:45.2%"></i><i class="b" style="width:41.2%"></i><i class="c" style="width:10.7%"></i><i class="d" style="width:2.9%"></i></div>
   <ul class="legend2"><li><span class="sw" style="background:var(--ink)"></span><span>Subscriptions<span class="sub">412 × $4, your 80%</span></span><b>$1,318.40</b></li><li><span class="sw" style="background:var(--sticker)"></span><span>Programming<span class="sub">Northwind Air, 12 films</span></span><b>$1,200.00</b></li><li><span class="sw" style="background:var(--muted)"></span><span>Events<span class="sub">Salt Year screening, 26 seats</span></span><b>$312.00</b></li><li><span class="sw" style="background:color-mix(in srgb,var(--muted) 45%,var(--line))"></span><span>Shop links<span class="sub">61 purchases, disclosed on each pick</span></span><b>$84.20</b></li></ul></div></div>
  <div class="sec">Subscribers <small>412 · +36 this month</small></div>
  <div class="panel"><div class="box"><svg class="spark" viewBox="0 0 300 66" preserveAspectRatio="none" role="img" aria-label="Subscribers per month, 38 to 412">${bars}</svg></div></div>
  <div class="sec">Your list <small>${L.length} of 10</small></div>
  <div class="panel"><div class="lu" style="padding-top:8px"><div class="slots">${L.map((k,i)=>`<div class="slot" data-go="pick" data-id="${k}"><span class="n">${i+1}</span>${cover(W[k])}</div>`).join("")}</div><p class="lu-note">One slot open. When the list is full, adding a pick retires one.</p></div></div>
  <div class="sec">Programming requests <small>paid curation for businesses</small></div>
  <div class="panel">${REQ.map(reqRow).join("")}</div>
  <div class="sec">Vouch requests</div>
  <div class="panel"><div class="req"><div class="top">${avName("Jun Ito",190)}<div class="grow"><b>Jun Ito asks you to vouch</b><span class="sub">Programs a short-film festival in Seoul. Your vouch is public and carries your name.</span></div></div>${S.vouchJun?`<div class="state">${S.vouchJun}</div>`:`<div class="btns"><button class="btn sm" data-act="vj" data-id="Vouched · Jun has 2 of 2">Vouch</button><button class="btn sm ghost" data-act="vj" data-id="Declined quietly">Not now</button></div>`}</div></div>
  <div class="sec">House rules</div>
  <div class="panel"><ul class="rules"><li>${icon("pen")}<span><b>Your words.</b> Reasons are written by the person who signs them.</span></li><li>${icon("flag")}<span><b>Every pick carries a disclosure.</b> Links that pay you say so, with the rate.</span></li><li>${icon("ban")}<span><b>No paid placements.</b> Two confirmed reports pause your page until a person reviews it.</span></li></ul></div>
  <div style="height:24px"></div>`;
}

function compose(){
  const L=LISTS.mara,w=W.quiet;
  const discs=[["No relationship",""],["Screener or review copy",""],["A link that pays me","The rate shows on the pick"],["Paid placement","Not allowed on Vouch"]];
  return `${hdr("New pick",`<button class="btn sm sticker" data-act="publish" style="margin-right:6px">Publish</button>`)}
  <div class="panel"><div class="lhead" style="padding-bottom:14px"><span>Goes in at #10 · last open slot</span><span class="slotbar" aria-hidden="true">${Array.from({length:10},(_,i)=>`<i class="${i<L.length?"":"nw"}"></i>`).join("")}</span></div></div>
  <div class="form" style="margin-top:8px">
   <div class="lbl"><span>What is it</span></div>
   <div class="found">${cover(w)}<div><b>${esc(w.title)}</b><span>Film · ${esc(w.by)} · ${w.year} · ${esc(w.spec)}</span></div></div>
   <label class="lbl" for="why"><span>Why, in your own words</span><span>214 / 600</span></label>
   <textarea class="inp" id="why">A year in a mountain village, told in four seasons and almost no dialogue. Sorel shot it on film with a crew of five, and you can feel how long they waited for every shot. Watch it on the biggest screen you can find, with your phone in another room.</textarea>
   <p class="hint">Write it yourself. Reasons drafted by AI tools aren’t allowed, and your signature goes on this one.</p>
   <div class="lbl"><span>Disclosure</span></div>
   ${discs.map(([t,s],i)=>`<button class="opt ${S.compDisc===i?"on":""}" data-act="disc" data-id="${i}" ${i===3?"disabled":""}><span class="dot"></span><span>${t}${s?`<small>${s}</small>`:""}</span></button>`).join("")}
   <button class="toggle ${S.compLock?"on":""}" data-act="lock"><span class="sw"></span><span>Subscribers only<br><small class="hint">Followers see the title and cover; subscribers get the note.</small></span></button>
   <div class="signed"><span class="hint">Signed</span><span class="sig lg">Mara Okonkwo</span></div>
  </div><div style="height:24px"></div>`;
}

const SCREENS={home,discover,events,saved,you,curator,pick,studio,compose};

/* ---------- sheets ---------- */
function openSheet(kind,id){
  S.sheet=kind;
  const c=id?C(id):null;
  let h=`<div class="grab"></div>`;
  if(kind==="sub"){
    h+=`<div class="shd">${av(c,"md")}<div><h2>Subscribe to ${esc(c.name)}</h2><p>${esc(c.line)}</p></div><button class="ib" data-act="close" aria-label="Close">${icon("close")}</button></div>
    <div class="price">$${c.price}<small> a month · cancel any time</small></div>
    <div class="split" role="img" aria-label="80 percent to the curator, 20 percent to Vouch"><i class="a" style="width:80%"></i><i class="b" style="width:20%"></i></div>
    <div class="splitl"><span>To ${esc(first(c.name))} <b>$${(c.price*.8).toFixed(2)}</b></span><span>To Vouch <b>$${(c.price*.2).toFixed(2)}</b></span></div>
    <ul class="incl"><li>${icon("check")}The full note on every pick</li>${c.id==="sable"?`<li>${icon("check")}Sunday Table notes, every week</li>`:""}<li>${icon("check")}First seats at ${esc(first(c.name))}’s events</li><li>${icon("check")}Reply to ${esc(first(c.name))} directly</li></ul>
    <button class="btn wide sticker" data-act="subscribe" data-id="${c.id}">Subscribe · $${c.price} a month</button><p class="fine">Prototype. Nothing is charged.</p>`;
  }else if(kind==="where"){
    const w=W[id],cc=C(w.c),where=w.where||DEFAULT_WHERE[w.m];
    h+=`<div class="shd"><div><h2>${esc(w.title)}</h2><p>Where to get it, as ${esc(first(cc.name))} listed it</p></div><button class="ib" data-act="close" aria-label="Close">${icon("close")}</button></div>
    ${where.map(x=>`<div class="row wrow" data-act="open" data-id="${esc(x[0])}"><div class="grow"><b>${esc(x[0])}</b><span class="sub">${esc(x[1])}</span></div>${x[2]?`<span class="earn">${esc(x[2])}</span>`:""}${icon("chev","sm")}</div>`).join("")}
    <div class="disc" style="padding:12px 0 0"><span class="kick">${icon("flag")}Disclosure</span><p>${esc(w.disc)}</p></div>`;
  }else if(kind==="rules"){
    h+=`<div class="shd"><div><h2>How Home works</h2><p>Three rules, and no settings to tune.</p></div><button class="ib" data-act="close" aria-label="Close">${icon("close")}</button></div>
    <ul class="rules" style="padding:0"><li>${icon("people")}<span><b>Only people you follow.</b> No suggested posts, no ads, no strangers.</span></li><li>${icon("clock")}<span><b>Newest first.</b> Nothing is boosted, reordered or hidden.</span></li><li>${icon("check")}<span><b>It ends.</b> When you’ve seen everything, Home says so.</span></li></ul>
    <p class="hint" style="margin-top:14px">You meet new people in Discover, through the people you already trust.</p>`;
  }else if(kind==="invite"){
    h+=`<div class="shd"><div><h2>Invite someone</h2><p>They’ll see your name and can start with the people you follow.</p></div><button class="ib" data-act="close" aria-label="Close">${icon("close")}</button></div>
    <div style="font:800 30px/1 var(--display);letter-spacing:.06em;text-align:center;padding:22px;border:1.5px dashed var(--line);border-radius:14px">ALEX-4M9P</div>
    <button class="btn wide" data-act="copyinvite" style="margin-top:14px">Copy invite link</button>`;
  }
  $("#sheet").innerHTML=h;$("#sheet-root").hidden=false;renderRail();
}
function closeSheet(){S.sheet=null;$("#sheet-root").hidden=true;renderRail();}
let tt;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2000);}

/* ---------- prototype rail ---------- */
const JUMPS=[
 ["welcome","Welcome","Invite-only start"],
 ["home","Home","People, not feeds. Newest first. It ends."],
 ["pick","Pick","Reason, signature, disclosure, where to buy"],
 ["curator","Curator","A list of ten, vouches, subscribe"],
 ["subscribe","Subscribe","80 / 20 revenue split"],
 ["discover","Discover","Found through vouches. A to Z, no ranking"],
 ["events","Events","Hosted by curators, ticketed"],
 ["saved","Saved","One queue across media"],
 ["studio","Studio","Payouts, programming requests, vouches"],
 ["compose","New pick","One slot, your own words"],
];
function railAt(){
  if(S.welcome)return "welcome";
  if(S.sheet==="sub")return "subscribe";
  const t=cur();
  if(t)return t.n;
  return S.tab;
}
function renderRail(){
  const r=$("#rail");if(!r)return;
  const at=railAt(),th=document.documentElement.dataset.theme||"auto";
  r.innerHTML=`<span class="brand">Vouch${vp("","")}</span>
  <p class="thesis">Human taste across all media, as the antidote to machine content.</p>
  <div><h2>Screens</h2><div class="jumps">${JUMPS.map(([k,l,n],i)=>`<button class="jump ${at===k?"on":""}" data-jump="${k}"><span class="n">${String(i+1).padStart(2,"0")}</span><b>${l}</b><span>${n}</span></button>`).join("")}</div></div>
  <div><h2>Theme</h2><div class="seg" style="margin:0;background:var(--line)">${[["auto","Auto"],["light","Light"],["dark","Dark"]].map(([k,l])=>`<button class="${th===k?"on":""}" data-theme-set="${k}">${l}</button>`).join("")}</div></div>
  <p class="fine">Visual prototype. People, works and numbers are fictional. Nothing is saved or charged.</p>`;
}
function jump(k){
  closeSheet();S.welcome=false;S.stack=[];
  const m={welcome:()=>{S.welcome=true;},home:()=>{S.tab="home";},pick:()=>{S.tab="home";S.stack=[{n:"pick",p:{id:"salt"}}];},curator:()=>{S.tab="home";S.stack=[{n:"curator",p:{id:"mara"}}];},
   subscribe:()=>{S.tab="home";S.stack=[{n:"curator",p:{id:"sable"}}];},discover:()=>{S.tab="discover";},events:()=>{S.tab="events";},saved:()=>{S.tab="saved";},
   studio:()=>{S.tab="you";S.stack=[{n:"studio",p:{}}];},compose:()=>{S.tab="you";S.stack=[{n:"studio",p:{}},{n:"compose",p:{}}];}};
  m[k]();render();
  if(k==="subscribe")openSheet("sub","sable");
}

/* ---------- actions ---------- */
function act(a,id){
  switch(a){
    case "back":back();break;
    case "close":closeSheet();break;
    case "start":S.welcome=false;S.tab="home";render();toast("Following Mara’s five.");break;
    case "start-discover":setTab("discover");break;
    case "welcome":S.welcome=true;S.stack=[];render();break;
    case "rules":openSheet("rules");break;
    case "follow":{const c=C(id);if(S.follows.has(id)){S.follows.delete(id);toast(`Unfollowed ${first(c.name)}.`);}else{S.follows.add(id);toast(`Following ${first(c.name)}. New picks land in Home.`);}render();break;}
    case "save":if(S.saved.has(id)){S.saved.delete(id);S.done.delete(id);toast("Removed from Saved.");}else{S.saved.add(id);toast("Saved.");}render();break;
    case "share":toast("Link copied.");break;
    case "where":openSheet("where",id);break;
    case "open":closeSheet();toast(`Opens ${id}. Not linked in the prototype.`);break;
    case "report":toast("Reported. A person reviews it within a day.");break;
    case "subsheet":openSheet("sub",id);break;
    case "subscribe":S.subs.add(id);closeSheet();render();toast(`Subscribed. $${(C(id).price*.8).toFixed(2)} a month goes to ${first(C(id).name)}.`);break;
    case "unsub":S.subs.delete(id);render();toast(`Cancelled. ${first(C(id).name)} keeps this month’s share.`);break;
    case "seat":if(S.seats.has(id)){S.seats.delete(id);toast("Seat released.");}else{S.seats.add(id);toast("Seat reserved. Details are in your email.");}render();break;
    case "ptab":cur().p.tab=id;render();break;
    case "dfilter":S.dFilter=id;render();break;
    case "sfilter":S.sFilter=id;render();break;
    case "evtab":S.evTab=id;render();break;
    case "req":{const [r,st]=id.split(":");S.req[r]=st;render();toast(st==="Accepted"?"Accepted. The brief is in your email.":"Passed.");break;}
    case "vj":S.vouchJun=id;render();toast(id.startsWith("Vouched")?"Vouched. Jun joins on Monday.":"Declined. Jun isn’t notified.");break;
    case "disc":S.compDisc=+id;render();break;
    case "lock":S.compLock=!S.compLock;render();break;
    case "publish":back();toast("Published to your list at #10.");break;
    case "comment":{const i=$("#cmt");if(!i.value.trim()){toast("Write something first.");break;}toast("Posted. (Comments aren’t stored in the prototype.)");i.value="";break;}
    case "invite":openSheet("invite");break;
    case "copyinvite":closeSheet();toast("Invite link copied. 1 invite left.");break;
  }
}
document.addEventListener("click",e=>{
  const th=e.target.closest("[data-theme-set]");
  if(th){const v=th.dataset.themeSet,r=document.documentElement;if(v==="auto")delete r.dataset.theme;else r.dataset.theme=v;renderRail();return;}
  const j=e.target.closest("[data-jump]");if(j){jump(j.dataset.jump);return;}
  const a=e.target.closest("[data-act]");if(a){if(a.disabled)return;act(a.dataset.act,a.dataset.id);return;}
  const t=e.target.closest("[data-tab]");if(t){closeSheet();setTab(t.dataset.tab);return;}
  const g=e.target.closest("[data-go]");if(g){closeSheet();go(g.dataset.go,{id:g.dataset.id});}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.sheet)closeSheet();
  if(e.key==="Enter"&&e.target.id==="cmt")act("comment");
});
render();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lull</title>
<!-- The Home Screen web app (js/webapp.js, sw.js): its manifest, icons and the phone's status bar. The macOS app ignores these. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lull">
<meta name="application-name" content="Lull">
<meta name="theme-color" content="#0d1017" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f0f2f6" media="(prefers-color-scheme: light)">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="css/lull.css">
</head>
<body>
<div id="app" class="bg-glass">
  <header id="titlebar" data-drag>
    <div class="brand" data-drag><span class="logo" aria-hidden="true"></span><span class="name">Lull</span></div>
    <canvas class="bar-idle" id="bar-idle" data-drag aria-hidden="true"></canvas>
    <!-- Places to play, room to drag, places to look (Stats, Achievements) by the wallet (the Shop), sound and Settings, the window. -->
    <nav class="tabs modes" id="tabs" role="tablist" aria-label="Play"></nav>
    <div class="spacer" data-drag></div>
    <nav class="tabs meta" id="tabs-meta" role="tablist" aria-label="Progress"></nav>
    <button class="wallet" id="wallet" aria-label="Shop" data-tip="Shop"><span class="lg" id="wallet-icon"></span><span id="wallet-n">0</span></button>
    <span class="tb-sep" aria-hidden="true"></span>
    <button class="icon-btn" id="btn-mute" aria-label="Mute" aria-pressed="false" data-tip="Mute" data-tip-foot="M"></button>
    <button class="icon-btn" id="btn-settings" aria-label="Settings" data-tip="Settings" data-tip-foot="⌘,"></button>
    <span class="tb-sep win" aria-hidden="true"></span>
    <div class="winbtns" id="winbtns">
      <button class="icon-btn" id="btn-pin" aria-label="Float on top" aria-pressed="false" data-tip="Float on top"></button>
      <button class="icon-btn" id="btn-collapse" aria-label="Collapse" aria-expanded="true" data-tip="Collapse" data-tip-foot="⌘J"></button>
      <button class="icon-btn" id="btn-hide" aria-label="Hide" data-tip="Hide" data-tip-foot="⌥⌘L brings it back"></button>
      <button class="icon-btn" id="btn-close" aria-label="Quit" data-tip="Quit"></button>
    </div>
  </header>

  <main id="main">
    <!-- Free play -->
    <section class="view" id="view-play" data-tab="play">
      <div class="boardwrap"><canvas id="cv-play"></canvas><div class="overlay hidden" id="play-overlay"></div></div>
      <div class="statusbar" id="play-status"></div>
      <div class="itembar" id="itembar"></div>
    </section>

    <!-- Puzzles: a slim bar (difficulty, Daily, Seed, History), the puzzle's card (name, seed, goal, wildcards), the board, the actions -->
    <section class="view" id="view-puzzle" data-tab="puzzle">
      <div class="puz-bar">
        <div class="seg" id="puz-diff"></div>
        <div class="puz-nav">
          <button class="btn sm" id="puz-daily" title="Daily"></button>
          <button class="btn sm" id="puz-seedbtn" title="Seed"></button>
          <button class="btn sm" id="puz-history" title="History"></button>
        </div>
      </div>
      <div class="puz-card" id="puz-card">
        <div class="puz-top">
          <span class="puz-dot" id="puz-dot"></span>
          <div class="puz-name"><div class="puz-title" id="puz-title"></div><div class="puz-id" id="puz-id"></div></div>
          <button class="puz-seed" id="puz-seed" data-tip="Copy seed"></button>
          <button class="icon-btn star" id="puz-save" title="Save seed" aria-label="Save seed"></button>
        </div>
        <div class="puz-goal" id="puz-goal"></div>
        <div class="puz-mods" id="puz-mods"></div>
      </div>
      <div class="boardwrap"><canvas id="cv-puzzle"></canvas><div class="overlay hidden" id="puz-overlay"></div></div>
      <div class="puz-actions" id="puz-actions"></div>
    </section>

    <!-- Factory -->
    <section class="view" id="view-factory" data-tab="factory">
      <div class="fac-col">
        <div class="fac-stage">
          <div class="fac-plate" id="fac-plate">
            <div class="fac-clip"><canvas id="cv-floor"></canvas></div>
            <div class="fac-hots" id="fac-hots"></div>
          </div>
          <div class="fac-bar">
            <div class="fac-stats" id="fac-top"></div>
            <div class="fac-collect" id="fac-collect"></div>
          </div>
        </div>
        <div class="fac-list" id="fac-list"></div>
      </div>
    </section>

    <!-- Shop (the wallet opens it): Items or Cosmetics, a jump to each section, then every section in one scroll -->
    <section class="view" id="view-shop" data-tab="shop">
      <div class="shop-head" id="shop-head"></div>
      <div class="shop-body scroll" id="shop-body"></div>
    </section>

    <!-- Achievements -->
    <section class="view" id="view-achievements" data-tab="achievements">
      <div class="stats-body scroll" id="ach-body"></div>
    </section>

    <!-- Statistics -->
    <section class="view" id="view-stats" data-tab="stats">
      <div class="subtabs" id="stats-tabs"></div>
      <div class="stats-body scroll" id="stats-body"></div>
    </section>
  </main>

  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div class="edge" data-edge="grip"></div>
</div>

<script src="js/util.js"></script>
<script src="js/icons.js"></script>
<script src="js/pieces.js"></script>
<script src="js/board.js"></script>
<script src="js/recipe.js"></script>
<script src="js/engine.js"></script>
<script src="js/items.js"></script>
<script src="js/library.js"></script>
<script src="js/puzzlegen.js"></script>
<script src="js/factory.js"></script>
<script src="js/store.js"></script>
<script src="js/achievements.js"></script>
<script src="js/fxphysics.js"></script>
<script src="js/render.js"></script>
<script src="js/factoryview.js"></script>
<script src="js/voice-data.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/touch.js"></script>
<script src="js/hints.js"></script>
<script src="js/ui.js"></script>
<script src="js/modes.js"></script>
<script src="js/retiredview.js"></script>
<script src="js/collapse.js"></script>
<link rel="stylesheet" href="css/shapes.css">
<script src="js/polytable.js"></script>
<script src="js/minsize.js"></script>
<script src="js/shapes.js"></script>
<script src="js/shapepicker.js"></script>
<script src="js/mirror.js"></script>
<script src="js/mirrorview.js"></script>
<script src="js/physics.js"></script>
<script src="js/physicsview.js"></script>
<script src="js/classic.js"></script>
<script src="js/classicview.js"></script>
<link rel="stylesheet" href="css/descent.css">
<script src="js/descent.js"></script>
<script src="js/descentview.js"></script>
<link rel="stylesheet" href="css/battle.css">
<script src="js/battle.js"></script>
<script src="js/battleview.js"></script>
<link rel="stylesheet" href="css/mural.css">
<script src="js/mural.js"></script>
<script src="js/muralview.js"></script>
<script src="js/app.js"></script>
<script src="js/webapp.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Focus &amp; Fix</title>
    <link rel="stylesheet" href="../ui/ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <h1>Focus &amp; Fix</h1>
        <p id="status" class="status" aria-live="polite"></p>
      </div>
      <input type="checkbox" class="switch big" id="enabled" aria-label="Hiding on or off" />
    </header>

    <div class="bar">
      <span class="label">Pause</span>
      <button type="button" data-pause="5">5 min</button>
      <button type="button" data-pause="15">15 min</button>
      <button type="button" data-pause="60">1 h</button>
      <button type="button" id="resume" hidden>Resume</button>
    </div>

    <div class="presets" id="presets"></div>
    <input type="search" id="search" placeholder="Find an option…" aria-label="Find an option" />
    <div id="groups"></div>

    <div class="actions">
      <button type="button" id="pick" class="primary">Pick an element to hide</button>
      <button type="button" id="options">All settings</button>
    </div>

    <section class="tab">
      <h2>This tab</h2>
      <dl class="stats">
        <dt>Feed items filtered</dt><dd data-stat="filtered">–</dd>
        <dt>Player requests patched</dt><dd data-stat="requestsPatched">–</dd>
        <dt>Timers shortened</dt><dd data-stat="timersBoosted">–</dd>
        <dt>Ad slots fast-forwarded</dt><dd data-stat="adsFastForwarded">–</dd>
        <dt>Stalls recovered</dt><dd data-stat="stallsRecovered">–</dd>
        <dt>Dialogs dismissed</dt><dd data-stat="dialogsDismissed">–</dd>
      </dl>
      <p id="note" hidden>Open a YouTube tab to see its counts and pick elements.</p>
    </section>

    <script src="../src/schema.js"></script>
    <script src="../src/store.js"></script>
    <script src="../ui/controls.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>

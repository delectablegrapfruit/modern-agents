<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scroll to Scrub</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="row">
      <h1>Scroll to Scrub</h1>
      <label class="switch">
        <input type="checkbox" id="enabled" aria-label="On" />
        <span class="track"></span>
      </label>
    </header>

    <section class="row" id="siteRow" hidden>
      <span id="siteName" class="grow"></span>
      <label class="switch">
        <input type="checkbox" id="siteEnabled" aria-label="On this site" />
        <span class="track"></span>
      </label>
    </section>

    <section class="block">
      <div class="row">
        <label for="speed" class="grow">Speed</label>
        <output id="speedValue" for="speed"></output>
      </div>
      <input type="range" id="speed" min="0" max="1000" step="1" />
    </section>

    <section class="block">
      <button type="button" id="undo" disabled>Undo scrub</button>
      <p id="undoInfo" class="muted">Nothing to undo</p>
    </section>

    <footer class="row">
      <a href="#" id="options">Settings</a>
    </footer>

    <script src="../shared/defaults.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Books</title>
<meta name="color-scheme" content="light dark">
<meta name="description" content="An offline reader modelled on Books for macOS: library, collections, reading goals, highlights, notes and a paginated reader.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Books">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0f0f2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2b2b2d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/reader.css">
</head>
<body>
<div id="app" class="app">
  <aside id="sidebar" class="sidebar" aria-label="Library sidebar">
    <div class="traffic-lights" aria-hidden="true">
      <span class="tl tl-red" id="tl-close" title="Close"></span>
      <span class="tl tl-yellow" id="tl-min" title="Minimize"></span>
      <span class="tl tl-green" id="tl-zoom" title="Enter Full Screen"></span>
    </div>
    <nav id="source-list" class="source-list"></nav>
    <div class="sidebar-footer">
      <button class="sidebar-add" id="btn-new-collection" type="button" title="New Collection">
        <span class="plus-circle">+</span><span>New Collection</span>
      </button>
    </div>
  </aside>

  <main class="content" id="content">
    <header class="toolbar" id="toolbar">
      <div class="toolbar-left">
        <button class="tb-btn" id="btn-sidebar" type="button" title="Hide Sidebar (⌃⌘S)" aria-label="Toggle sidebar"></button>
        <div class="tb-nav">
          <button class="tb-btn" id="btn-back" type="button" title="Back" aria-label="Back" disabled></button>
          <button class="tb-btn" id="btn-forward" type="button" title="Forward" aria-label="Forward" disabled></button>
        </div>
        <div class="toolbar-title" id="toolbar-title">Home</div>
      </div>
      <div class="toolbar-right">
        <button class="tb-btn" id="btn-add" type="button" title="Add to Library… (⌘O)"></button>
        <button class="tb-popup" id="sort-btn" type="button" title="Sort By">
          <span class="tb-popup-label" id="sort-label">Recent</span><span class="tb-popup-chevrons"></span>
        </button>
        <div class="segmented" id="view-seg" role="group" aria-label="View">
          <button type="button" data-view="grid" class="active" title="Grid View" aria-label="Grid"></button>
          <button type="button" data-view="list" title="List View" aria-label="List"></button>
        </div>
        <label class="search-field" id="search-wrap">
          <span class="search-icon"></span>
          <input type="search" id="search-field" placeholder="Search Library" autocomplete="off" spellcheck="false" aria-label="Search Library">
        </label>
        <button class="tb-btn" id="btn-more" type="button" title="More"></button>
      </div>
    </header>
    <section id="view" class="view" tabindex="-1"></section>
    <div class="drop-overlay" id="drop-overlay" hidden><div class="drop-card"><div class="drop-icon"></div><div>Add to Library</div><small>EPUB, PDF and plain-text files</small></div></div>
  </main>
</div>

<div id="reader" class="reader" hidden>
  <header class="reader-toolbar" id="rd-toolbar">
    <div class="rd-group rd-left">
      <button class="rd-btn rd-back" id="rd-back" type="button" title="Library (Esc)"><span class="rd-back-label">Library</span></button>
      <button class="rd-btn" id="rd-toc" type="button" title="Table of Contents"></button>
      <button class="rd-btn" id="rd-appearance" type="button" title="Themes &amp; Settings"></button>
    </div>
    <div class="rd-title" id="rd-title"><span class="rd-book-title" id="rd-book-title"></span></div>
    <div class="rd-group rd-right">
      <button class="rd-btn" id="rd-search" type="button" title="Search in Book (⌘F)"></button>
      <button class="rd-btn" id="rd-bookmark" type="button" title="Add Bookmark (⌘D)"></button>
      <button class="rd-btn" id="rd-fullscreen" type="button" title="Full Screen"></button>
    </div>
  </header>
  <div class="reader-stage" id="rd-stage">
    <iframe id="rd-frame" class="reader-frame" title="Book content" sandbox="allow-same-origin"></iframe>
    <div class="reader-spine" id="rd-spine" hidden></div>
    <button class="reader-nav reader-nav-left" id="rd-prev" type="button" title="Previous Page" aria-label="Previous page"></button>
    <button class="reader-nav reader-nav-right" id="rd-next" type="button" title="Next Page" aria-label="Next page"></button>
    <div class="reader-loading" id="rd-loading"><div class="spinner"></div><div id="rd-loading-text">Opening…</div></div>
    <div class="reader-pdf" id="rd-pdf" hidden></div>
  </div>
  <footer class="reader-footer" id="rd-footer">
    <div class="rd-foot-left" id="rd-chapter"></div>
    <div class="rd-foot-center" id="rd-page"></div>
    <div class="rd-foot-right" id="rd-left"></div>
    <input type="range" class="reader-scrubber" id="rd-scrubber" min="0" max="100" value="0" step="1" aria-label="Book position">
  </footer>
</div>

<div id="overlays"></div>
<input type="file" id="file-input" multiple accept=".epub,.pdf,.txt,.md,.text,application/epub+zip,application/pdf,text/plain" hidden>

<script src="js/util.js"></script>
<script src="js/icons.js"></script>
<script src="js/zip.js"></script>
<script src="js/db.js"></script>
<script src="js/epub.js"></script>
<script src="js/ui.js"></script>
<script src="js/library.js"></script>
<script src="js/reader.js"></script>
<script src="js/app.js"></script>
</body>
</html>

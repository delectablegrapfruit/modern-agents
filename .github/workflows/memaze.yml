name: Memaze

on:
  push:
    paths: ["memaze/**", ".github/workflows/memaze.yml"]
  pull_request:
    paths: ["memaze/**", ".github/workflows/memaze.yml"]

permissions:
  contents: read

jobs:
  test:
    name: Maze generator, server and autopilot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generator and levels (200 mazes, 120 levels, endless chunks)
        run: node memaze/tests/gen.test.js
      - name: Chapter 1's hand-made layouts
        run: node memaze/tests/hand.test.js
      - name: Player picture (GIF decoder, pixel hitbox, embedded defaults)
        run: node memaze/tests/sprite.test.js
      - name: serve.py answers and serves the game
        run: |
          python3 memaze/serve.py --no-open --port 8765 &
          for i in $(seq 1 20); do curl -fsS localhost:8765/api/ping && break; sleep 0.5; done
          curl -fsS localhost:8765/api/media
          curl -fsS -o /dev/null localhost:8765/
          curl -fsS -o /dev/null localhost:8765/js/game.js
      - name: Autopilot plays levels 1-40 and Gauntlet mazes without touching an edge
        run: |
          cd memaze && npm init -y >/dev/null && npm i --no-save playwright@1 && npx playwright install --with-deps chromium
          node tests/autopilot.js 1-40 --strict
          node tests/autopilot.js 1-10 --gauntlet=hard/random/ci --strict
          node tests/autopilot.js 8-10 --strict --speed=90
          node tests/autopilot.js 8-10 --strict --speed=200
      - name: Hits, mystery boxes, items and flags
        run: cd memaze && node tests/items.js
      - name: Level mechanics, remix, Gauntlet and the menu
        run: cd memaze && node tests/mechanics.js

name: CI

on:
  push:
    paths-ignore:
      - "dist/**"
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

# One build per branch at a time: a newer push cancels the run before it, which also keeps two runs from committing
# dist/ at once.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build, test, launch-test, bundle
    permissions:
      contents: write
    # Hosted macOS minutes bill at ten times the rate of Linux ones; a repository variable LIMITER_MACOS_RUNNER (or
    # BOOKS_MACOS_RUNNER, shared with the Books branch) set to e.g. "self-hosted" points the job at your own Mac.
    runs-on: ${{ vars.LIMITER_MACOS_RUNNER || vars.BOOKS_MACOS_RUNNER || 'macos-26' }}
    env:
      APP: Audio Limiter.app
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - run: swift test
      - run: scripts/make-app.sh release && test -f "build/$APP/Contents/Resources/AppIcon.icns" && plutil -lint "build/$APP/Contents/Info.plist"

      - name: Package (zip + dmg + checksums)
        run: |
          mkdir -p dist
          rm -f dist/AudioLimiter.app.zip dist/AudioLimiter.dmg
          ditto -c -k --keepParent "build/$APP" dist/AudioLimiter.app.zip
          hdiutil create -volname "Audio Limiter" -srcfolder "build/$APP" -ov -format UDZO dist/AudioLimiter.dmg
          (cd dist && shasum -a 256 AudioLimiter.app.zip AudioLimiter.dmg | tee SHA256SUMS.txt)
          ls -la dist

      - name: Launch test — the packaged app, unzipped elsewhere with the build directory hidden, lists the output devices, checks the volume mapping on their curves and lays out its menu
        timeout-minutes: 5
        run: |
          mv .build "$RUNNER_TEMP/hidden-build"
          rm -rf "$RUNNER_TEMP/launch" && mkdir -p "$RUNNER_TEMP/launch"
          ditto -x -k dist/AudioLimiter.app.zip "$RUNNER_TEMP/launch"
          LIMITER_SELFTEST=1 "$RUNNER_TEMP/launch/$APP/Contents/MacOS/AudioLimiter"
          mv "$RUNNER_TEMP/hidden-build" .build

      - name: Tap test (informational) — builds a process tap and an aggregate device for the runner's first output device, if it has one, and takes them down
        continue-on-error: true
        timeout-minutes: 2
        run: LIMITER_SELFTEST=1 LIMITER_SELFTEST_TAP=1 "$RUNNER_TEMP/launch/$APP/Contents/MacOS/AudioLimiter"

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AudioLimiter.app
          if-no-files-found: warn
          path: |
            dist/AudioLimiter.app.zip
            dist/AudioLimiter.dmg
            dist/SHA256SUMS.txt

      - name: Commit packages to dist/
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/AudioLimiter.app.zip dist/AudioLimiter.dmg dist/SHA256SUMS.txt
          if git diff --cached --quiet; then echo "dist/ unchanged"; exit 0; fi
          git commit -m "ci: package Audio Limiter.app into dist/ (${GITHUB_SHA::7}) [skip ci]"
          # Should another run have committed dist/ meanwhile, this build's files win.
          git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Attach packages to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AudioLimiter.app.zip
            dist/AudioLimiter.dmg
            dist/SHA256SUMS.txt

  linux:
    name: Linux core build and test
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    name: macOS build, test, bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build -v
      - run: swift test
      - run: scripts/make-app.sh release
      - uses: actions/upload-artifact@v4
        with:
          name: Winnow.app
          path: build/Winnow.app
          if-no-files-found: error

  linux:
    name: Linux core build and test
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift build --product winnow-cli
      - run: swift test

name: CI

on:
  push:
    # Branches only: a tag push is not a build (and must not try to commit dist/ to a tag).
    branches: ["**"]
    paths-ignore:
      - "dist/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One build per branch at a time: a newer push cancels the run before it, which also keeps two runs from committing
# dist/ at once.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux core build, test, balance
    runs-on: ubuntu-latest
    container: swift:6.0
    # Normally a few minutes.
    timeout-minutes: 20
    # (The swift image has no make: these are the Makefile's commands, spelled out.)
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
      - name: Sheets — every frame, the cut and the falling dead render as SVG
        run: |
          sheets=$(mktemp -d)
          for sheet in all dead ragdoll; do
            swift run ronin-sheet "$sheets/$sheet.svg" "$sheet"
            test -s "$sheets/$sheet.svg"
          done
          ls -l "$sheets"
      - name: Balance — a human-like pilot and a perfect one play every stage, in every mode
        run: |
          swift run -c release ronin-sim --mode all --stages 1-20 --seeds 10 --check
          swift run -c release ronin-sim --mode all --stages 1-25 --seeds 4 --perfect --check
      - name: Balance — campaign runs from stage 1, hearts carried, in every mode
        run: swift run -c release ronin-sim --campaign --mode all --check
      - name: Balance — the perfect pilot on through stages 26-60
        run: swift run -c release ronin-sim --mode all --stages 26-60 --seeds 2 --perfect --check
      - name: Slower hands (closer to a first-time player; a report, not held to a bar)
        run: swift run -c release ronin-sim --mode shoshin --stages 1-12 --seeds 10 --reaction 0.3 --rate 5 --slips 0.05
      - name: The gourd won by a quick, well-timed hand and by the default one (a report; the won column)
        run: |
          swift run -c release ronin-sim --hearts --mode all --stages 1-20 --seeds 6 --reaction 0.18 --rate 8 --slips 0.01 --timing 0.02 | grep -E "hearts$|^stage|all "
          swift run -c release ronin-sim --hearts --mode all --stages 1-20 --seeds 6 | grep -E "hearts$|^stage|all "
      - name: A warlord stage, second by second (a report)
        run: swift run -c release ronin-sim --trace 5 | tail -25

  macos:
    name: macOS build, test, self-test, bundle
    # The balance runs are the Linux job's; waiting for it keeps a build that fails them out of dist/.
    needs: linux
    permissions:
      contents: write
    # Hosted macOS minutes bill at ten times the Linux rate; a repository variable RONIN_MACOS_RUNNER (for example
    # "self-hosted") points the job at your own Mac.
    runs-on: ${{ vars.RONIN_MACOS_RUNNER || 'macos-26' }}
    # Normally under ten minutes; a crashed self-test's report and backtrace can add eight more.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - run: swift test
      - name: Bundle
        run: |
          scripts/make-app.sh release
          test -f build/Ronin.app/Contents/Resources/AppIcon.icns || echo "::warning::no app icon"

      - name: Package (zip + dmg + checksums)
        run: |
          mkdir -p dist
          rm -f dist/Ronin.app.zip dist/Ronin.dmg
          ditto -c -k --keepParent build/Ronin.app dist/Ronin.app.zip
          hdiutil create -volname Ronin -srcfolder build/Ronin.app -ov -format UDZO dist/Ronin.dmg
          (cd dist && shasum -a 256 Ronin.app.zip Ronin.dmg | tee SHA256SUMS.txt)

      - name: Self-test — the packaged app, unzipped elsewhere, fights and writes what it showed
        timeout-minutes: 6
        run: |
          rm -rf "$RUNNER_TEMP/launch" build/screenshots && mkdir -p "$RUNNER_TEMP/launch"
          ditto -x -k dist/Ronin.app.zip "$RUNNER_TEMP/launch"
          (sleep 20; screencapture -x build/desktop.png || true) &
          # The shots go to build/ first: dist/screenshots, the committed ones the README shows, is only replaced
          # after a passing run (a shot that cannot be taken fails it), so a failed run never deletes them.
          RONIN_SELFTEST=1 RONIN_SNAPSHOTS="$PWD/build/screenshots" "$RUNNER_TEMP/launch/Ronin.app/Contents/MacOS/Ronin"
          wait
          ls -la build/screenshots
          # A shot this run did not take (one taken only if its moment comes) is dropped, and said so.
          for old in dist/screenshots/*.png; do
            if [ -e "$old" ] && [ ! -e "build/screenshots/${old##*/}" ]; then echo "::notice::${old##*/} was not taken this run"; fi
          done
          rm -rf dist/screenshots
          mv build/screenshots dist/screenshots

      - name: Crash report (when the self-test crashed)
        if: failure()
        timeout-minutes: 8
        run: |
          # The newest crash report's crashed thread, symbolicated as far as the report goes.
          report=$(ls -t ~/Library/Logs/DiagnosticReports/Ronin* 2>/dev/null | head -1 || true)
          if [ -n "$report" ]; then
            python3 - "$report" <<'PY'
          import json, sys
          text = open(sys.argv[1]).read()
          body = json.loads(text[text.index('\n') + 1:])
          print(body.get('exception'), body.get('termination', {}).get('indicator'))
          images = body.get('usedImages', [])
          for thread in body.get('threads', []):
              if not thread.get('triggered'): continue
              for frame in thread.get('frames', [])[:60]:
                  image = images[frame['imageIndex']].get('name', '?') if frame.get('imageIndex', -1) < len(images) else '?'
                  print(image, frame.get('symbol', hex(frame.get('imageOffset', 0))), frame.get('sourceFile', ''), frame.get('sourceLine', ''))
          PY
          fi
          # And the crash again under the debugger, for a backtrace with line numbers where it has them.
          rm -rf "$RUNNER_TEMP/debug-snaps"
          RONIN_SELFTEST=1 RONIN_SNAPSHOTS="$RUNNER_TEMP/debug-snaps" lldb --batch -o run -k "thread backtrace -c 60" -k "quit 1" -- "$RUNNER_TEMP/launch/Ronin.app/Contents/MacOS/Ronin" 2>&1 | tail -120 || true

      - name: Upload packages and screenshots (also when a test failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ronin.app
          if-no-files-found: warn
          # (After a failed self-test, what it did show is in build/screenshots; dist/ still holds the committed ones.)
          path: |
            dist/
            build/*.png
            build/screenshots/

      - name: Commit packages to dist/
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/Ronin.app.zip dist/Ronin.dmg dist/SHA256SUMS.txt
          git add -f dist/screenshots 2>/dev/null || true
          if git diff --cached --quiet; then echo "dist/ unchanged"; exit 0; fi
          git commit -m "ci: package Ronin.app into dist/ (${GITHUB_SHA::7}) [skip ci]"
          git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

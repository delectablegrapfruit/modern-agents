name: CI

on:
  push:
    paths-ignore:
      - "dist/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One build per branch at a time: a newer push cancels the run before it, which also keeps two runs from committing
# dist/ at once.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build, test, self-test, bundle
    permissions:
      contents: write
    # Hosted macOS minutes bill at ten times the Linux rate; a repository variable RONIN_MACOS_RUNNER (for example
    # "self-hosted") points the job at your own Mac.
    runs-on: ${{ vars.RONIN_MACOS_RUNNER || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - run: swift test
      - name: Balance — a human-like pilot and a perfect one play every stage
        run: |
          swift run -c release ronin-sim --stages 1-20 --seeds 10 --check
          swift run -c release ronin-sim --stages 1-20 --seeds 6 --perfect --check
      - name: Bundle
        run: |
          scripts/make-app.sh release
          test -f build/Ronin.app/Contents/Resources/AppIcon.icns || echo "::warning::no app icon"

      - name: Package (zip + dmg + checksums)
        run: |
          mkdir -p dist
          rm -f dist/Ronin.app.zip dist/Ronin.dmg
          ditto -c -k --keepParent build/Ronin.app dist/Ronin.app.zip
          hdiutil create -volname Ronin -srcfolder build/Ronin.app -ov -format UDZO dist/Ronin.dmg
          (cd dist && shasum -a 256 Ronin.app.zip Ronin.dmg | tee SHA256SUMS.txt)

      - name: Self-test — the packaged app, unzipped elsewhere, fights and writes what it showed
        timeout-minutes: 6
        run: |
          rm -rf "$RUNNER_TEMP/launch" && mkdir -p "$RUNNER_TEMP/launch"
          ditto -x -k dist/Ronin.app.zip "$RUNNER_TEMP/launch"
          rm -rf dist/screenshots
          (sleep 20; screencapture -x build/desktop.png || true) &
          RONIN_SELFTEST=1 RONIN_SNAPSHOTS="$PWD/dist/screenshots" "$RUNNER_TEMP/launch/Ronin.app/Contents/MacOS/Ronin"
          wait
          ls -la dist/screenshots || true

      - name: Upload packages and screenshots (also when a test failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ronin.app
          if-no-files-found: warn
          path: |
            dist/
            build/*.png

      - name: Commit packages to dist/
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/Ronin.app.zip dist/Ronin.dmg dist/SHA256SUMS.txt
          git add -f dist/screenshots 2>/dev/null || true
          if git diff --cached --quiet; then echo "dist/ unchanged"; exit 0; fi
          git commit -m "ci: package Ronin.app into dist/ (${GITHUB_SHA::7}) [skip ci]"
          git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  linux:
    name: Linux core build, test, balance
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
      - run: swift run -c release ronin-sim --stages 1-20 --seeds 10 --check
      - run: swift run -c release ronin-sim --stages 1-25 --seeds 6 --perfect --check
      - name: Slower hands (closer to a first-time player)
        run: swift run -c release ronin-sim --stages 1-12 --seeds 10 --reaction 0.3 --rate 5 --slips 0.05
      - run: swift run -c release ronin-sim --trace 5 | tail -25

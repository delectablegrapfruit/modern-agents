name: Onslaught

on:
  push:
    paths:
      - "Onslaught/**"
      - "!Onslaught/dist/**"
      - ".github/workflows/onslaught.yml"
  pull_request:
    paths:
      - "Onslaught/**"
      - ".github/workflows/onslaught.yml"
  workflow_dispatch:

permissions:
  contents: read

# One build per branch at a time: a newer push cancels the run before it, which also keeps two runs from committing
# Onslaught/dist/ at once.
concurrency:
  group: onslaught-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Onslaught

jobs:
  macos:
    name: macOS build, test, self-test, bundle
    permissions:
      contents: write
    # Hosted macOS minutes bill at ten times the Linux rate; a repository variable ONSLAUGHT_MACOS_RUNNER (for example
    # "self-hosted") points the job at your own Mac.
    runs-on: ${{ vars.ONSLAUGHT_MACOS_RUNNER || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - run: swift test
      - name: Balance — the autopilot fights every wave and plays whole runs
        run: swift run -c release onslaught-sim --waves 1-12 --seeds 8 --runs 12 --check
      - name: Bundle
        run: |
          scripts/make-app.sh release
          test -f build/Onslaught.app/Contents/Resources/AppIcon.icns || echo "::warning::no app icon"

      - name: Package (zip + dmg + checksums)
        run: |
          mkdir -p dist
          rm -f dist/Onslaught.app.zip dist/Onslaught.dmg
          ditto -c -k --keepParent build/Onslaught.app dist/Onslaught.app.zip
          hdiutil create -volname Onslaught -srcfolder build/Onslaught.app -ov -format UDZO dist/Onslaught.dmg
          (cd dist && shasum -a 256 Onslaught.app.zip Onslaught.dmg | tee SHA256SUMS.txt)

      - name: Self-test — the packaged app, unzipped elsewhere, fights a boss and writes what it showed
        timeout-minutes: 5
        run: |
          rm -rf "$RUNNER_TEMP/launch" && mkdir -p "$RUNNER_TEMP/launch"
          ditto -x -k dist/Onslaught.app.zip "$RUNNER_TEMP/launch"
          rm -rf dist/screenshots
          (sleep 14; screencapture -x build/desktop.png || true) &
          ONSLAUGHT_SELFTEST=1 ONSLAUGHT_SNAPSHOTS="$PWD/dist/screenshots" "$RUNNER_TEMP/launch/Onslaught.app/Contents/MacOS/Onslaught"
          wait
          ls -la dist/screenshots || true

      - name: Upload packages and screenshots (also when a test failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Onslaught.app
          if-no-files-found: warn
          path: |
            Onslaught/dist/
            Onslaught/build/*.png

      - name: Commit packages to Onslaught/dist/
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/Onslaught.app.zip dist/Onslaught.dmg dist/SHA256SUMS.txt
          git add -f dist/screenshots 2>/dev/null || true
          if git diff --cached --quiet; then echo "dist/ unchanged"; exit 0; fi
          git commit -m "ci: package Onslaught.app into Onslaught/dist/ (${GITHUB_SHA::7}) [skip ci]"
          git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  linux:
    name: Linux core build, test, balance
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
      - run: swift run -c release onslaught-sim --waves 1-15 --seeds 10 --runs 16 --check
      - name: Balance with a slower pilot (closer to a person)
        run: swift run -c release onslaught-sim --waves 1-12 --seeds 8 --runs 12 --reaction 0.2

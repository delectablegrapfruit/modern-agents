<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Memaze default win screen. Intro: burst + wordmark pop in over ~0.55s; then the rays turn and the wordmark bobs. -->
